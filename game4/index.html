<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>听海休息室 · 奇li小岛</title>
<script>
var _hmt=_hmt||[];
(function(){var hm=document.createElement('script');
hm.src='https://hm.baidu.com/hm.js?e8ffc5809fb30e7ae87e03bc0fce1bfc';
var s=document.getElementsByTagName('script')[0];s.parentNode.insertBefore(hm,s);})();
function TRACK(e,p){try{if(window._hmt)window._hmt.push(['_trackEvent','island_room',e,JSON.stringify(p||{})]);}catch(x){}}
var GZH_BIZ='Mzg4NjQ3MjM3NQ==',GZH_NAME='奇迹心li';
var GZH_HOME='https://mp.weixin.qq.com/mp/profile_ext?action=home&__biz='+GZH_BIZ+'&scene=124#wechat_redirect';
var inWeChat=/MicroMessenger/i.test(navigator.userAgent);
</script>
<style>
:root{--sea:#2d6b63;--sea2:#3f847a;--cream:#f7f4ec;--ink:#2b4a47;--mut:#7a9993;--line:rgba(45,107,99,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
padding:12px 14px;pointer-events:none}
.top a,.top button{pointer-events:auto;text-decoration:none;color:var(--sea);font-size:12px;letter-spacing:1px;
background:rgba(247,244,236,.8);border:1px solid var(--line);border-radius:20px;padding:7px 13px;cursor:pointer}
.top .name{color:var(--sea);font-size:13.5px;letter-spacing:2px;font-weight:600;background:transparent;border:none}
.hint{position:fixed;left:0;right:0;top:64px;z-index:5;text-align:center;color:var(--sea);
font-size:13.5px;letter-spacing:2px;pointer-events:none;font-weight:500}
.hint small{color:var(--mut);font-size:11px;font-weight:400;display:block;letter-spacing:1px;margin-top:4px}
.act{position:fixed;left:0;right:0;bottom:98px;z-index:6;text-align:center}
.act button{background:var(--sea);color:#fff;border:none;border-radius:26px;padding:12px 40px;
font-size:14px;letter-spacing:2px;cursor:pointer;box-shadow:0 6px 18px rgba(45,107,99,.28)}
.act button:active{transform:scale(.97)}
.count{position:fixed;left:50%;bottom:152px;transform:translateX(-50%);z-index:6;font-size:10.5px;color:var(--mut);letter-spacing:1px}
.tabs{position:fixed;left:0;right:0;bottom:58px;z-index:6;display:flex;justify-content:center;gap:8px}
.tabs a,.tabs span{font-size:11px;letter-spacing:1px;color:var(--mut);text-decoration:none;
background:rgba(247,244,236,.7);border:1px solid var(--line);border-radius:16px;padding:6px 12px}
.tabs .cur{color:#fff;background:var(--sea2);border-color:var(--sea2)}
.gzh{position:fixed;left:14px;right:14px;bottom:10px;z-index:6;text-decoration:none;
display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.82);
border:1px solid var(--line);border-radius:14px;padding:9px 13px;color:var(--ink)}
.gzh .ic{flex:none;width:28px;height:28px;border-radius:9px;background:rgba(45,107,99,.12);
display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--sea)}
.gzh .tx{flex:1;min-width:0}
.gzh b{display:block;font-size:12px;color:var(--sea);font-weight:600}
.gzh small{display:block;font-size:10px;color:var(--mut);margin-top:1px}
.gzh .ar{color:var(--sea2);font-size:16px}
.setting{position:fixed;right:14px;top:56px;z-index:7;background:rgba(255,255,255,.96);
border:1px solid var(--line);border-radius:16px;padding:18px;width:252px;box-shadow:0 8px 30px rgba(45,74,71,.18);display:none}
.setting.show{display:block}
.setting h3{margin:0 0 14px;font-size:15px;color:var(--sea);text-align:center;letter-spacing:2px}
.setting .row{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;font-size:12.5px;color:var(--ink)}
.setting .row small{display:block;color:var(--mut);font-size:10px;margin-top:2px}
.setting .sw{width:44px;height:25px;border-radius:14px;background:#cdd8d3;position:relative;cursor:pointer;transition:background .2s;flex:none}
.setting .sw.on{background:var(--sea2)}
.setting .sw i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.setting .sw.on i{left:22px}
.setting .row.sel small{font-size:10.5px}
.setting .rate{display:flex;gap:6px}
.setting .rate button{background:var(--sea);color:#fff;border:none;border-radius:12px;padding:5px 9px;font-size:11px;cursor:pointer}
.setting .rate button:not(.on){background:rgba(45,107,99,.12);color:var(--mut)}
.setting .rec{margin-top:12px;background:rgba(45,107,99,.06);border-radius:10px;padding:11px 12px;font-size:11px;color:var(--mut);line-height:1.8}
.setting .rec b{color:var(--sea2)}
.setting .close{display:block;width:100%;margin-top:14px;background:var(--sea);color:#fff;border:none;border-radius:20px;padding:9px;font-size:12.5px;letter-spacing:2px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:154px;transform:translateX(-50%) translateY(14px);
background:rgba(43,74,71,.92);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:20px;
opacity:0;pointer-events:none;transition:.25s;z-index:99;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="top">
  <a href="../index.html">‹ 小岛</a>
  <button class="name">听海休息室</button>
  <button id="setBtn">设置</button>
</div>
<div class="hint" id="hint">靠窗坐下，跟着海浪呼吸<small id="hintSub">点「开始」跟着节奏慢慢来</small></div>
<div class="count" id="count">已陪你呼吸 0 次</div>
<div class="act"><button id="actBtn">开 始 呼 吸</button></div>
<div class="tabs">
  <span class="cur">休息室</span><a href="../game1/index.html">龟背湾</a><a href="../game2/index.html">白鸥礁</a><a href="../game3/index.html">星火滩</a>
</div>
<a class="gzh" href="javascript:void(0)" id="gzhBtn">
  <span class="ic">✦</span>
  <span class="tx"><b>关注「奇迹心li」</b><small>倾诉陪伴 · 分享思路</small></span>
  <span class="ar">›</span>
</a>
<div class="setting" id="setting">
  <h3>设 置</h3>
  <div class="row"><span>海浪与海风<small>呼吸的节奏声与白噪音</small></span><div class="sw on" id="swSound"><i></i></div></div>
  <div class="row sel"><span>呼吸节奏<small>一个循环 = 吸气+呼气</small></span>
    <div class="rate"><button data-r="8">快</button><button data-r="10" class="on">中</button><button data-r="13">慢</button></div></div>
  <div class="rec">今天陪你呼吸 <b id="recToday">0</b> 次 · 共 <b id="recTotal">0</b> 次<br>数据只保存在本机，不含货币、商城与社交功能</div>
  <button class="close" id="setClose">关闭</button>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
  function resize(){W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
  window.addEventListener('resize',resize);

  var KEY='game4_room_v1',save={total:0,date:'',today:0,rate:10};
  try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)save=s;}catch(e){}
  var today=new Date().toISOString().slice(0,10);if(save.date!==today){save.date=today;save.today=0;}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}

  var AC=null,ambient=null,soundOn=true,rate=save.rate||10;
  function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
  function noiseBuf(a,sec){var len=Math.floor(a.sampleRate*sec),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0),last=0;
    for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5;}return b;}
  function startAmbient(){var a=ac();if(!a||ambient)return;
    var src=a.createBufferSource();src.buffer=noiseBuf(a,4);src.loop=true;
    var lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;
    var g=a.createGain();g.gain.value=0;src.connect(lp);lp.connect(g);g.connect(a.destination);src.start();
    g.gain.linearRampToValueAtTime(soundOn?0.15:0,a.currentTime+4);
    var osc=a.createOscillator(),og=a.createGain();osc.frequency.value=1/rate;og.gain.value=0.06;
    osc.connect(og);og.connect(g.gain);osc.start();ambient={gain:g,osc:osc,og:og};}
  function chime(up){if(!soundOn)return;var a=ac();if(!a)return;
    var o=a.createOscillator(),g=a.createGain();o.type='sine';
    o.frequency.setValueAtTime(up?520:400,a.currentTime);
    g.gain.setValueAtTime(0.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(0.1,a.currentTime+0.4);
    g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+1.4);
    o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+1.5);}

  var running=false,phase=0,cycle=0,lastPhase=0,t=0,bird=null,birdTimer=4;
  var hint=document.getElementById('hint'),hintSub=document.getElementById('hintSub'),actBtn=document.getElementById('actBtn'),count=document.getElementById('count'),toast=document.getElementById('toast');
  function toastShow(m){toast.textContent=m;toast.classList.add('show');clearTimeout(toastShow._t);toastShow._t=setTimeout(function(){toast.classList.remove('show');},1600);}

  function drawRoom(){
    // 室内墙面
    var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#f3efe4');g.addColorStop(1,'#e9e2d1');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // 地板
    ctx.fillStyle='#ddd0b6';ctx.fillRect(0,H*0.82,W,H*0.18);
    ctx.strokeStyle='rgba(150,130,95,.2)';ctx.lineWidth=1;
    for(var i=1;i<6;i++){ctx.beginPath();ctx.moveTo(0,H*0.82+i*H*0.036);ctx.lineTo(W,H*0.82+i*H*0.036);ctx.stroke();}
    // 落地窗框
    var wx=W*0.1,wy=H*0.12,ww=W*0.8,wh=H*0.66;
    ctx.save();ctx.beginPath();ctx.rect(wx,wy,ww,wh);ctx.clip();
    // 窗外天空
    var sg=ctx.createLinearGradient(0,wy,0,wy+wh);sg.addColorStop(0,'#dcebe6');sg.addColorStop(1,'#eef3e2');
    ctx.fillStyle=sg;ctx.fillRect(wx,wy,ww,wh);
    // 太阳
    ctx.fillStyle='rgba(246,230,189,.7)';ctx.beginPath();ctx.arc(wx+ww*0.75,wy+wh*0.24,26,0,7);ctx.fill();
    // 云
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(wx+ww*0.3,wy+wh*0.3,44,10,0,0,7);ctx.fill();
    // 海（跟着呼吸轻微起伏）
    var breath=Math.sin(phase*2*Math.PI)*6;
    var seaY=wy+wh*0.5+breath;
    var og=ctx.createLinearGradient(0,seaY,0,wy+wh);og.addColorStop(0,'#a9cfc6');og.addColorStop(1,'#7fb6ac');
    ctx.fillStyle=og;ctx.fillRect(wx,seaY,ww,wy+wh-seaY);
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.4;
    for(var k=0;k<4;k++){ctx.beginPath();var yy=seaY+14+k*16;
      for(var x=wx;x<=wx+ww;x+=12){var p=yy+Math.sin(x*0.05+t*1.1+k)*2;x===wx?ctx.moveTo(x,p):ctx.lineTo(x,p);}ctx.stroke();}
    // 远处小岛
    ctx.fillStyle='rgba(120,150,135,.35)';ctx.beginPath();ctx.ellipse(wx+ww*0.55,seaY,60,10,0,Math.PI,0);ctx.fill();
    // 海鸟
    if(bird){ctx.strokeStyle='#5c7f6e';ctx.lineWidth=1.6;ctx.beginPath();
      ctx.moveTo(bird.x,bird.y);ctx.quadraticCurveTo(bird.x+6,bird.y-5,bird.x+12,bird.y);
      ctx.quadraticCurveTo(bird.x+18,bird.y-5,bird.x+24,bird.y);ctx.stroke();}
    ctx.restore();
    // 窗框
    ctx.strokeStyle='#c9bda3';ctx.lineWidth=7;ctx.strokeRect(wx,wy,ww,wh);
    ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(wx+ww/2,wy);ctx.lineTo(wx+ww/2,wy+wh);
    ctx.moveTo(wx,wy+wh*0.5);ctx.lineTo(wx+ww,wy+wh*0.5);ctx.stroke();
    // 窗帘
    ctx.fillStyle='rgba(232,214,180,.7)';
    ctx.beginPath();ctx.moveTo(wx-6,wy);ctx.quadraticCurveTo(wx+22,wy+wh*0.5,wx-6,wy+wh);ctx.lineTo(wx-30,wy+wh);ctx.lineTo(wx-30,wy);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(wx+ww+6,wy);ctx.quadraticCurveTo(wx+ww-22,wy+wh*0.5,wx+ww+6,wy+wh);ctx.lineTo(wx+ww+30,wy+wh);ctx.lineTo(wx+ww+30,wy);ctx.closePath();ctx.fill();
  }
  function drawBreath(){
    if(!running)return;
    var cx=W/2,cy=H*0.46;
    // 吸气时圆变大
    var scale=0.5+0.5*(0.5-0.5*Math.cos(phase*2*Math.PI));
    var r=28+scale*46;
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,'+(0.18+scale*0.18)+')';ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
    ctx.restore();
  }
  function loop(){t+=0.016;
    if(running){
      phase+=0.016/rate;
      if(phase>=1){phase-=1;cycle++;save.total++;save.today++;persist();TRACK('breath_cycle',{total:save.total});
        count.textContent='已陪你呼吸 '+save.total+' 次';updateRec();}
      var p=phase*2;
      if(p<1&&lastPhase>=1||(phase<lastPhase)){} // noop
      var inhaling=phase<0.5;
      if(inhaling!==lastPhase){chime(inhaling);}
      lastPhase=inhaling?1:0;
      hint.innerHTML=inhaling?'吸 气 …':'慢 慢 呼 气 …';
      hintSub.textContent='跟着圆圈，一个节奏一次呼吸';
    }
    // 海鸟飞过
    birdTimer-=0.016;
    if(birdTimer<=0&&!bird){bird={x:-30,y:H*0.2+Math.random()*H*0.12};birdTimer=7+Math.random()*6;}
    if(bird){bird.x+=0.5;if(bird.x>W+40)bird=null;}
    ctx.clearRect(0,0,W,H);drawRoom();drawBreath();
    requestAnimationFrame(loop);
  }
  actBtn.addEventListener('click',function(){
    startAmbient();running=!running;
    if(running){actBtn.textContent='暂 停 一 下';tmsg('跟着圆圈，慢慢来');TRACK('start',{rate:rate});}
    else{actBtn.textContent='继 续 呼 吸';hint.innerHTML='停一停也好<small>想继续时点下面的按钮</small>';}
  });
  function tmsg(a){hint.innerHTML=a+'<small>跟着圆圈，一个节奏一次呼吸</small>';}
  // 点击画面也算一次呼吸切换（轻互动）
  cv.addEventListener('pointerdown',function(){startAmbient();});

  var setting=document.getElementById('setting');
  document.getElementById('setBtn').addEventListener('click',function(){setting.classList.toggle('show');updateRec();});
  document.getElementById('setClose').addEventListener('click',function(){setting.classList.remove('show');});
  function sw(id,cb){var el=document.getElementById(id);el.addEventListener('click',function(){el.classList.toggle('on');cb(el.classList.contains('on'));});}
  sw('swSound',function(v){soundOn=v;if(ambient&&AC)ambient.gain.gain.setTargetAtTime(v?0.15:0,AC.currentTime,0.1);});
  document.querySelectorAll('.rate button').forEach(function(b){b.addEventListener('click',function(){
    document.querySelectorAll('.rate button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');
    rate=parseInt(b.getAttribute('data-r'),10);save.rate=rate;persist();
    if(ambient&&ambient.osc&&AC)ambient.osc.frequency.setTargetAtTime(1/rate,AC.currentTime,0.1);
  });});
  function updateRec(){document.getElementById('recToday').textContent=save.today;document.getElementById('recTotal').textContent=save.total;}
  document.getElementById('gzhBtn').addEventListener('click',function(){
    TRACK('gzh_click',{});if(inWeChat){location.href=GZH_HOME;return;}
    try{var ta=document.createElement('textarea');ta.value=GZH_NAME;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toastShow('已复制「'+GZH_NAME+'」，去微信搜索关注');}catch(e){toastShow('请在微信搜索「'+GZH_NAME+'」');}
  });
  resize();count.textContent='已陪你呼吸 '+save.total+' 次';updateRec();loop();
})();
</script>
</body>
</html>
