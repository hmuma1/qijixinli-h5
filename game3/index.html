<style>

font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}

border:1px solid rgba(232,200,138,.24);border-radius:16px;padding:18px;width:252px;box-shadow:0 8px 30px rgba(0,0,0,.4);display:none}

background:rgba(232,200,138,.94);color:#26343a;font-size:12.5px;padding:9px 16px;border-radius:20px;
opacity:0;pointer-events:none;transition:.25s;z-index:99;white-space:nowrap}

<body>
<canvas id="cv"></canvas>
<div class="top">
  <a href="../index.html">‹ 小岛</a>
  <button class="name">星火滩</button>
  <button id="setBtn">设置</button>
</div>
<div class="hint" id="hint">天色暗下来了，海边生起一堆火<small>安静地守着它就好</small></div>
<div class="prog" id="prog">8 / 20</div>
<div class="act"><button id="actBtn">添 一 把 柴</button></div>
<div class="tabs">
  <a href="../game1/index.html">龟背湾</a><a href="../game2/index.html">白鸥礁</a><span class="cur">星火滩</span>
</div>
<a class="gzh" href="javascript:void(0)" id="gzhBtn">
  <span class="ic">✦</span>
  <span class="tx"><b>关注「奇迹心li」</b><small>倾诉陪伴 · 分享思路</small></span>
  <span class="ar">›</span>
</a>
<div class="setting" id="setting">
  <h3>设 置</h3>
  <div class="row"><span>声音<small>海浪与篝火的噼啪声</small></span><div class="sw on" id="swSound"><i></i></div></div>
  <div class="row"><span>轻震动<small>添柴时的轻微反馈</small></span><div class="sw on" id="swVibe"><i></i></div></div>
  <div class="rec">今晚添了 <b id="recWood">8</b> 把柴 · 共 <b id="recTotal">0</b> 次生火<br>只做安静陪伴，无许愿与占卜 · 数据存本机</div>
  <button class="close" id="setClose">关闭</button>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
  function resize(){W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
  window.addEventListener('resize',resize);
  var KEY='game3_bonfire_v1',save={total:0,date:'',wood:8};
  try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)save=s;}catch(e){}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}

  var AC=null,ambient=null,soundOn=true,vibeOn=true;
  function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
  function noiseBuf(a,sec){var len=Math.floor(a.sampleRate*sec),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0),last=0;
    for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+0.03*w)/1.03;d[i]=last*3;}return b;}
  function startAmbient(){var a=ac();if(!a||ambient)return;
    var src=a.createBufferSource();src.buffer=noiseBuf(a,4);src.loop=true;
    var lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=400;
    var g=a.createGain();g.gain.value=0;src.connect(lp);lp.connect(g);g.connect(a.destination);src.start();
    g.gain.linearRampToValueAtTime(soundOn?0.12:0,a.currentTime+4);ambient={gain:g};}
  function crackle(){if(!soundOn)return;var a=ac();if(!a)return;
    var src=a.createBufferSource();src.buffer=noiseBuf(a,0.12);
    var hp=a.createBiquadFilter();hp.type='highpass';hp.frequency.value=1500;
    var g=a.createGain();g.gain.setValueAtTime(0.14,a.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+0.1);
    src.connect(hp);hp.connect(g);g.connect(a.destination);src.start();}
  function vibe(){if(vibeOn&&navigator.vibrate)try{navigator.vibrate(14);}catch(e){}}

  var wood=save.wood||8,MAX=20,embers=[],sparks=[],t=0;
  var hint=document.getElementById('hint'),prog=document.getElementById('prog'),toast=document.getElementById('toast');
  function toastShow(m){toast.textContent=m;toast.classList.add('show');clearTimeout(toastShow._t);toastShow._t=setTimeout(function(){toast.classList.remove('show');},1600);}
  var stars=[];for(var i=0;i<70;i++)stars.push({x:Math.random(),y:Math.random()*0.45,r:Math.random()*1.2+0.3,a:Math.random()});

  function drawSky(){
    var g=ctx.createLinearGradient(0,0,0,H*0.5);g.addColorStop(0,'#101d24');g.addColorStop(1,'#1d3038');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H*0.5);
    stars.forEach(function(s){ctx.globalAlpha=0.4+0.5*Math.abs(Math.sin(t*0.7+s.a*9));ctx.fillStyle='#e8e2cf';
      ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,7);ctx.fill();});ctx.globalAlpha=1;
  }
  function drawSea(){
    var y=H*0.42,g=ctx.createLinearGradient(0,y,0,H*0.64);
    g.addColorStop(0,'#243b42');g.addColorStop(1,'#2c4a50');ctx.fillStyle=g;
    ctx.beginPath();ctx.moveTo(0,y);for(var x=0;x<=W;x+=12)ctx.lineTo(x,y+Math.sin(x*0.02+t*0.8)*2);
    ctx.lineTo(W,H*0.66);ctx.lineTo(0,H*0.66);ctx.closePath();ctx.fill();
    // 月光带
    ctx.fillStyle='rgba(232,226,207,.05)';ctx.beginPath();ctx.ellipse(W*0.7,y+18,70,10,0,0,7);ctx.fill();
    ctx.strokeStyle='rgba(200,220,220,.12)';ctx.lineWidth=1;
    for(var k=0;k<3;k++){ctx.beginPath();var yy=y+14+k*16;
      for(var x2=0;x2<=W;x2+=14){var p=yy+Math.sin(x2*0.03+t+k)*2;x2?ctx.lineTo(x2,p):ctx.moveTo(x2,p);}ctx.stroke();}
  }
  function drawBeach(){
    var y=H*0.62,g=ctx.createLinearGradient(0,y,0,H);g.addColorStop(0,'#5a5446');g.addColorStop(1,'#3d3a32');
    ctx.fillStyle=g;ctx.fillRect(0,y,W,H-y);
  }
  function drawFire(){
    var fx=W/2,fy=H*0.74,intensity=wood/MAX;
    // 火光晕
    var glow=ctx.createRadialGradient(fx,fy,4,fx,fy,120+intensity*90);
    glow.addColorStop(0,'rgba(240,180,90,'+(0.22+intensity*0.18)+')');glow.addColorStop(1,'rgba(240,180,90,0)');
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(fx,fy,120+intensity*90,0,7);ctx.fill();
    // 柴
    ctx.strokeStyle='#6b4f34';ctx.lineWidth=7;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(fx-26,fy+12);ctx.lineTo(fx+24,fy-2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(fx+26,fy+12);ctx.lineTo(fx-24,fy-2);ctx.stroke();
    // 火焰
    var h=(30+intensity*70);
    for(var i=0;i<3;i++){
      var off=(i-1)*10,flick=Math.sin(t*9+i*2)*6;
      var fg=ctx.createLinearGradient(0,fy,0,fy-h);
      fg.addColorStop(0,'rgba(230,120,50,.95)');fg.addColorStop(0.5,'rgba(245,180,70,.9)');fg.addColorStop(1,'rgba(255,225,140,0)');
      ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(fx+off-11,fy);
      ctx.quadraticCurveTo(fx+off-8,fy-h*0.5,fx+off+flick,fy-h);
      ctx.quadraticCurveTo(fx+off+8,fy-h*0.5,fx+off+11,fy);ctx.closePath();ctx.fill();
    }
    // 余烬
    embers.forEach(function(e){ctx.globalAlpha=e.a;ctx.fillStyle='#f0a860';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();});
    // 火星
    sparks.forEach(function(s){ctx.globalAlpha=s.a;ctx.fillStyle='#ffcf7a';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();});
    ctx.globalAlpha=1;
    // 剪影两个人影
    ctx.fillStyle='rgba(20,28,30,.85)';
    ctx.beginPath();ctx.arc(fx-70,fy+6,9,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(fx-70,fy+26,13,16,0,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(fx+70,fy+6,9,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(fx+70,fy+26,13,16,0,0,7);ctx.fill();
  }
  function loop(){t+=0.016;ctx.clearRect(0,0,W,H);drawSky();drawSea();drawBeach();drawFire();
    // 余烬与火星
    if(Math.random()<0.3)embers.push({x:W/2+(Math.random()-.5)*30,y:H*0.74,r:1+Math.random()*2,a:0.8});
    embers=embers.filter(function(e){e.y-=0.4;e.a-=0.012;return e.a>0;});
    if(Math.random()<wood/MAX*0.4)sparks.push({x:W/2+(Math.random()-.5)*20,y:H*0.74-20,vx:(Math.random()-.5)*0.8,vy:-1-Math.random(),r:1,a:1});
    sparks=sparks.filter(function(s){s.x+=s.vx;s.y+=s.vy;s.a-=0.015;return s.a>0;});
    requestAnimationFrame(loop);
  }
  function addWood(){
    if(wood<MAX){wood++;prog.textContent=wood+' / '+MAX;crackle();vibe();TRACK('add_wood',{wood:wood});
      for(var i=0;i<14;i++)sparks.push({x:W/2+(Math.random()-.5)*30,y:H*0.74-10,vx:(Math.random()-.5)*2,vy:-1-Math.random()*2,r:1+Math.random(),a:1});
      hint.innerHTML='火烧得旺了一些<small>就这么安静地待着</small>';
      if(wood===MAX){save.total++;save.wood=8;wood=8;persist();prog.textContent='8 / '+MAX;toastShow('火暖暖的，陪你坐了一会儿');updateRec();}
    }else{toastShow('火已经很旺了，慢慢烤着');}
  }
  document.getElementById('actBtn').addEventListener('click',function(){startAmbient();addWood();});
  cv.addEventListener('pointerdown',function(){startAmbient();});
  var setting=document.getElementById('setting');
  document.getElementById('setBtn').addEventListener('click',function(){setting.classList.toggle('show');updateRec();});
  document.getElementById('setClose').addEventListener('click',function(){setting.classList.remove('show');});
  function sw(id,cb){var el=document.getElementById(id);el.addEventListener('click',function(){el.classList.toggle('on');cb(el.classList.contains('on'));});}
  sw('swSound',function(v){soundOn=v;if(ambient&&AC)ambient.gain.gain.setTargetAtTime(v?0.12:0,AC.currentTime,0.1);});
  sw('swVibe',function(v){vibeOn=v;});
  function updateRec(){document.getElementById('recWood').textContent=wood;document.getElementById('recTotal').textContent=save.total;}
  document.getElementById('gzhBtn').addEventListener('click',function(){
    TRACK('gzh_click',{});if(inWeChat){location.href=GZH_HOME;return;}
    try{var ta=document.createElement('textarea');ta.value=GZH_NAME;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toastShow('已复制「'+GZH_NAME+'」，去微信搜索关注');}catch(e){toastShow('请在微信搜索「'+GZH_NAME+'」');}
  });
  resize();prog.textContent=wood+' / '+MAX;updateRec();loop();
})();
</script>
</body>
</html>
