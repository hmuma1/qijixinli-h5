<script>

hm.src='https://hm.baidu.com/hm.js?e8ffc5809fb30e7ae87e03bc0fce1bfc';

function TRACK(e,p){try{if(window._hmt)window._hmt.push(['_trackEvent','game3_bubble',e,JSON.stringify(p||{})]);}catch(x){}}

<style>
:root{--bg:#0c0a1c;--gold:#d9b25f;--gold2:#f0d79a;--ink:#ece6f5;--mut:#9b8fb8;--line:rgba(217,178,95,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
padding:14px 16px;pointer-events:none}
.top a{pointer-events:auto;text-decoration:none;color:var(--mut);font-size:12.5px;letter-spacing:1px;
background:rgba(12,10,28,.5);border:1px solid var(--line);border-radius:20px;padding:7px 13px}
.top .name{color:var(--gold2);font-size:13px;letter-spacing:2px;text-shadow:0 0 12px rgba(240,215,154,.5)}
.hint{position:fixed;left:0;right:0;bottom:80px;z-index:5;text-align:center;color:var(--mut);
font-size:12px;letter-spacing:1px;pointer-events:none;line-height:1.8;text-shadow:0 1px 6px #000}
.hint b{color:var(--gold2);font-weight:500}
.gzh{position:fixed;left:14px;right:14px;bottom:14px;z-index:6;text-decoration:none;
display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,rgba(217,178,95,.16),rgba(240,215,154,.04));
border:1px solid var(--line);border-radius:14px;padding:11px 14px;color:var(--ink)}
.gzh .ic{flex:none;width:30px;height:30px;border-radius:9px;background:rgba(217,178,95,.18);
display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--gold2)}
.gzh .tx{flex:1;min-width:0}
.gzh b{display:block;font-size:12.5px;color:var(--gold2);font-weight:500}
.gzh small{display:block;font-size:10.5px;color:var(--mut);margin-top:1px}
.gzh .ar{color:var(--gold);opacity:.7;font-size:16px}
.tools{position:fixed;right:14px;top:60px;z-index:6;display:flex;flex-direction:column;gap:8px}
.tools button{background:rgba(12,10,28,.55);border:1px solid var(--line);color:var(--gold2);
font-size:11.5px;letter-spacing:1px;border-radius:18px;padding:8px 13px;cursor:pointer}
.tools button:active{background:rgba(217,178,95,.22)}
.badge{position:fixed;left:14px;top:60px;z-index:6;font-size:12px;color:var(--gold2);
background:rgba(12,10,28,.5);border:1px solid var(--line);border-radius:16px;padding:7px 12px;letter-spacing:1px}
.badge b{font-weight:600}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="top">
  <a href="../games.html">‹ 游戏中心</a>
  <span class="name">捏泡时刻</span>
  <a href="../index.html">塔罗问迹</a>
</div>
<div class="badge">已捏破 <b id="ppN">0</b> 颗</div>
<div class="hint">点破就好 · 按住滑动可以连着捏<br>没有时间，也没有输赢</div>
<div class="tools"><button id="btnNew">换一张</button></div>
<a class="gzh" id="gzhBtn" href="https://mp.weixin.qq.com/s/ZEUDP3mg3K0vE88K5bFf4g">
  <span class="ic">✦</span>
  <span class="tx"><b>关注「奇迹心li」</b><small>倾诉陪伴 · 分享思路</small></span>
  <span class="ar">›</span>
</a>
<script>
/* 通用：WebAudio 合成音（无音频文件、无外部依赖） */
var AC=null;
function ACX(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function TONE(freq,dur,type,vol){
  var ac=ACX();if(!ac)return;
  if(ac.state==='suspended')ac.resume();
  var o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0,ac.currentTime);
  g.gain.linearRampToValueAtTime(vol||0.05,ac.currentTime+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+(dur||0.3));
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(dur||0.3)+0.02);
}
function NOISE(dur,vol){
  var ac=ACX();if(!ac)return;
  var n=Math.floor(ac.sampleRate*(dur||0.08)),buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();
  s.buffer=buf;f.type='highpass';f.frequency.value=900;g.gain.value=vol||0.045;
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
}
/* 通用：画布 / 自适应 / 星点背景 */
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=0,H=0,DPR=1,__lw=0,__lh=0;
function fit(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  var changed=Math.abs(W-__lw)>60||Math.abs(H-__lh)>120;__lw=W;__lh=H;
  if(changed){initStars();if(window.__onfit)window.__onfit();}
}
window.addEventListener('resize',fit);
var STARS=[];
function initStars(){
  STARS=[];var n=Math.min(90,Math.floor(W*H/9000));
  for(var i=0;i<n;i++)STARS.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.3,a:Math.random()*.5+.15,ph:Math.random()*6.28});
}
function drawStars(t){
  for(var i=0;i<STARS.length;i++){var s=STARS[i];
    ctx.globalAlpha=s.a*(.6+.4*Math.sin(t/1400+s.ph));ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;
}
function bg(t){
  var g=ctx.createRadialGradient(W*.5,H*.32,10,W*.5,H*.5,Math.max(W,H)*.9);
  g.addColorStop(0,'#221a44');g.addColorStop(.55,'#130f2c');g.addColorStop(1,'#0a0818');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);drawStars(t);
}
function pt(e){var t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};}
function save(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function load(k,d){try{return localStorage.getItem(k)||d;}catch(e){return d;}}
document.getElementById('gzhBtn').addEventListener('click',function(){TRACK('gzh_click',{});});

var B=[],P=[],total=0,popped=0,theme=0,cleared=false;
var TH=[['#7fe3d4','#a98cf0'],['#f2a7c8','#d9b25f'],['#8fb8ff','#7fe3d4']];
try{popped=parseInt(load('game3_pop_total','0'),10)||0;}catch(e){}
function build(){
  B=[];var gap=6,cols=Math.max(4,Math.floor((W-28)/56));
  var size=(W-28-(cols-1)*gap)/cols;
  var rows=Math.max(3,Math.floor((H-210)/(size+gap)));
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
    B.push({x:14+c*(size+gap)+size/2+(r%2?gap*.4:0),y:86+r*(size+gap)+size/2,
            rad:size/2,alive:true,ph:Math.random()*6.28});
  }
  total=B.length;cleared=false;
}
function badge(){var el=document.getElementById('ppN');if(el)el.textContent=popped;}
function pop(x,y){
  if(cleared){build();badge();return;}
  var hit=false,A=TH[theme%3];
  for(var i=0;i<B.length;i++){var b=B[i];
    if(!b.alive)continue;
    if((b.x-x)*(b.x-x)+(b.y-y)*(b.y-y)<(b.rad*1.06)*(b.rad*1.06)){
      b.alive=false;popped++;hit=true;
      for(var k=0;k<7;k++)P.push({x:b.x,y:b.y,vx:(Math.random()-.5)*3.2,vy:(Math.random()-.5)*3.2-1,
        r:Math.random()*2+1,life:1,c:k%2?A[0]:'#fff'});
    }
  }
  if(hit){NOISE(.055,.04);TONE(520+Math.random()*240,.11,'triangle',.03);
    save('game3_pop_total',String(popped));badge();
    var left=0;for(var j=0;j<B.length;j++)if(B[j].alive)left++;
    if(left===0)cleared=true;}
}
function down(e){e.preventDefault();ACX();var p=pt(e);pop(p.x,p.y);}
function move(e){if(e.buttons||e.pressure>0||e.pointerType==='touch'){var p=pt(e);pop(p.x,p.y);}}
cv.addEventListener('pointerdown',down);cv.addEventListener('pointermove',move);
document.getElementById('btnNew').addEventListener('click',function(){theme++;build();TONE(392,.2,'sine',.04);});
window.__onfit=function(){build();badge();};
function loop(now){
  bg(now);var A=TH[theme%3];
  for(var i=0;i<B.length;i++){var b=B[i];
    if(!b.alive){ctx.globalAlpha=.1;ctx.strokeStyle=A[0];ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(b.x,b.y,b.rad*.8,0,6.283);ctx.stroke();continue;}
    var pu=1+.022*Math.sin(now/900+b.ph);
    var g=ctx.createRadialGradient(b.x-b.rad*.3,b.y-b.rad*.36,1,b.x,b.y,b.rad*pu);
    g.addColorStop(0,'rgba(255,255,255,.6)');g.addColorStop(.35,A[0]+'55');
    g.addColorStop(.8,A[1]+'2a');g.addColorStop(1,'rgba(255,255,255,.05)');
    ctx.globalAlpha=1;ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(b.x,b.y,b.rad*pu*.94,0,6.283);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.24)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(b.x,b.y,b.rad*pu*.94,0,6.283);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.72)';
    ctx.beginPath();ctx.arc(b.x-b.rad*.32,b.y-b.rad*.34,b.rad*.13,0,6.283);ctx.fill();
  }
  for(var q=P.length-1;q>=0;q--){var p2=P[q];p2.x+=p2.vx;p2.y+=p2.vy;p2.vy+=.06;p2.life-=.022;
    if(p2.life<=0){P.splice(q,1);continue;}
    ctx.globalAlpha=p2.life;ctx.fillStyle=p2.c;
    ctx.beginPath();ctx.arc(p2.x,p2.y,p2.r,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;
  if(cleared){ctx.fillStyle='rgba(240,215,154,.9)';ctx.font='15px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.fillText('全捏完了 · 点一下换一张',W/2,H*.5);ctx.textAlign='left';}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);TRACK('game_open',{});

fit();
</script>
</body>
</html>
