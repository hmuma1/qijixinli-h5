<style>
:root{--bg:#0c0a1c;--gold:#d9b25f;--gold2:#f0d79a;--ink:#ece6f5;--mut:#9b8fb8;--line:rgba(217,178,95,.28)}

display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--gold2)}
.gzh .tx{flex:1;min-width:0}
.gzh b{display:block;font-size:12.5px;color:var(--gold2);font-weight:500}

<canvas id="cv"></canvas>
<div class="top">

  <span class="ar">›</span>
</a>
<script>
/* 通用：WebAudio 合成音（无音频文件、无外部依赖） */
var AC=null;
function ACX(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function TONE(freq,dur,type,vol){
  var ac=ACX();if(!ac)return;
  if(ac.state==='suspended')ac.resume();
  var o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0,ac.currentTime);
  g.gain.linearRampToValueAtTime(vol||0.05,ac.currentTime+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+(dur||0.3));
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(dur||0.3)+0.02);
}
function NOISE(dur,vol){
  var ac=ACX();if(!ac)return;
  var n=Math.floor(ac.sampleRate*(dur||0.08)),buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();
  s.buffer=buf;f.type='highpass';f.frequency.value=900;g.gain.value=vol||0.045;
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
}
/* 通用：画布 / 自适应 / 星点背景 */
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=0,H=0,DPR=1,__lw=0,__lh=0;
function fit(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  var changed=Math.abs(W-__lw)>60||Math.abs(H-__lh)>120;__lw=W;__lh=H;
  if(changed){initStars();if(window.__onfit)window.__onfit();}
}
window.addEventListener('resize',fit);
var STARS=[];
function initStars(){
  STARS=[];var n=Math.min(90,Math.floor(W*H/9000));
  for(var i=0;i<n;i++)STARS.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.3,a:Math.random()*.5+.15,ph:Math.random()*6.28});
}
function drawStars(t){
  for(var i=0;i<STARS.length;i++){var s=STARS[i];
    ctx.globalAlpha=s.a*(.6+.4*Math.sin(t/1400+s.ph));ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;
}
function bg(t){
  var g=ctx.createRadialGradient(W*.5,H*.32,10,W*.5,H*.5,Math.max(W,H)*.9);
  g.addColorStop(0,'#221a44');g.addColorStop(.55,'#130f2c');g.addColorStop(1,'#0a0818');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);drawStars(t);
}
function pt(e){var t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};}
function save(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function load(k,d){try{return localStorage.getItem(k)||d;}catch(e){return d;}}
document.getElementById('gzhBtn').addEventListener('click',function(){TRACK('gzh_click',{});});

var D=[],count=0,neb=null,nctx=null;
var COL=[[217,178,95],[127,227,212],[169,140,240],[242,167,200],[143,184,255]];
function badge(){var el=document.getElementById('dc');if(el)el.textContent=count;}
function build(){
  neb=document.createElement('canvas');neb.width=Math.max(1,W);neb.height=Math.max(1,H);
  nctx=neb.getContext('2d');D=[];count=0;badge();
}
function drop(x,y){
  if(!nctx)return;
  var c=COL[Math.floor(Math.random()*COL.length)],max=70+Math.random()*100;
  nctx.save();nctx.globalCompositeOperation='lighter';
  for(var i=0;i<6;i++){
    var ox=(Math.random()-.5)*max*.5,oy=(Math.random()-.5)*max*.5,r=max*(.45+Math.random()*.75);
    var g=nctx.createRadialGradient(x+ox,y+oy,0,x+ox,y+oy,r);
    g.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+',.20)');
    g.addColorStop(.5,'rgba('+c[0]+','+c[1]+','+c[2]+',.075)');
    g.addColorStop(1,'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
    nctx.fillStyle=g;nctx.beginPath();nctx.arc(x+ox,y+oy,r,0,6.283);nctx.fill();
  }
  for(var k=0;k<14;k++){
    var a=Math.random()*6.283,d=Math.random()*max*.7;
    nctx.globalAlpha=.5;nctx.fillStyle='rgba(255,255,255,.55)';
    nctx.beginPath();nctx.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,Math.random()*1.2+.4,0,6.283);nctx.fill();
  }
  nctx.restore();
  count++;badge();TONE(220+count*22%320,.6,'sine',.04);TRACK('drop',{n:count});
}
function down(e){e.preventDefault();ACX();var p=pt(e);drop(p.x,p.y);}
cv.addEventListener('pointerdown',down);
document.getElementById('btnClear').addEventListener('click',function(){build();TONE(294,.3,'sine',.04);});
document.getElementById('btnSave').addEventListener('click',function(){
  var c=document.createElement('canvas');c.width=750;c.height=1100;var g=c.getContext('2d');
  var bg2=g.createLinearGradient(0,0,0,1100);bg2.addColorStop(0,'#221a44');bg2.addColorStop(1,'#0a0818');
  g.fillStyle=bg2;g.fillRect(0,0,750,1100);
  g.strokeStyle='rgba(217,178,95,.35)';g.lineWidth=2;g.strokeRect(28,28,694,1044);
  if(neb){
    var s=Math.min(694/neb.width,760/neb.height),dw=neb.width*s,dh=neb.height*s;
    g.drawImage(neb,(750-dw)/2,120+(760-dh)/2,dw,dh);
  }
  g.textAlign='center';g.fillStyle='#f0d79a';
  g.font='600 44px -apple-system,"PingFang SC",sans-serif';g.fillText('今晚的星云',375,120);
  g.font='20px -apple-system,"PingFang SC",sans-serif';g.fillStyle='#9b8fb8';
  g.fillText('塔罗问迹 · 第 '+count+' 滴',375,965);
  g.font='17px -apple-system,"PingFang SC",sans-serif';g.fillText('来自「奇迹心li」· '+new Date().toLocaleDateString('zh-CN'),375,1010);
  var a=document.createElement('a');a.download='我的星云.png';a.href=c.toDataURL('image/png');a.click();
  TRACK('poster_save',{n:count});
});
window.__onfit=function(){build();};
function loop(now){
  bg(now);
  if(neb){ctx.globalAlpha=1;ctx.drawImage(neb,0,0,W,H);}
  if(count===0){ctx.globalAlpha=.5;ctx.fillStyle='#9b8fb8';ctx.font='14px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.fillText('点画面任意处，滴下第一滴',W/2,H*.5);ctx.textAlign='left';ctx.globalAlpha=1;}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);TRACK('game_open',{});

fit();
</script>
</body>
