<style>
:root{--sea:#2d6b63;--sea2:#3f847a;--cream:#f7f4ec;--ink:#2b4a47;--mut:#7a9993;--line:rgba(45,107,99,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
padding:12px 14px;pointer-events:none}
.top a,.top button{pointer-events:auto;text-decoration:none;color:var(--sea);font-size:12px;letter-spacing:1px;
background:rgba(247,244,236,.8);border:1px solid var(--line);border-radius:20px;padding:7px 13px;cursor:pointer}
.top .name{color:var(--sea);font-size:13.5px;letter-spacing:2px;font-weight:600;background:transparent;border:none}
.hint{position:fixed;left:0;right:0;top:62px;z-index:5;text-align:center;color:var(--sea);
font-size:13px;letter-spacing:1px;pointer-events:none;line-height:1.7;font-weight:500}
.hint small{color:var(--mut);font-size:11px;font-weight:400;display:block}

.act button{background:var(--sea);color:#fff;border:none;border-radius:26px;padding:13px 40px;
font-size:14px;letter-spacing:2px;cursor:pointer;box-shadow:0 6px 18px rgba(45,107,99,.28);opacity:.35;pointer-events:none;transition:opacity .2s}
.act button.on{opacity:1;pointer-events:auto}
.act button:active{transform:scale(.97)}
.tabs{position:fixed;left:0;right:0;bottom:58px;z-index:6;display:flex;justify-content:center;gap:8px}
.tabs a,.tabs span{font-size:11px;letter-spacing:1px;color:var(--mut);text-decoration:none;
background:rgba(247,244,236,.7);border:1px solid var(--line);border-radius:16px;padding:6px 12px}
.tabs .cur{color:#fff;background:var(--sea2);border-color:var(--sea2)}
.gzh{position:fixed;left:14px;right:14px;bottom:10px;z-index:6;text-decoration:none;
display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.82);
border:1px solid var(--line);border-radius:14px;padding:9px 13px;color:var(--ink)}
.gzh .ic{flex:none;width:28px;height:28px;border-radius:9px;background:rgba(45,107,99,.12);
display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--sea)}
.gzh .tx{flex:1;min-width:0}
.gzh b{display:block;font-size:12px;color:var(--sea);font-weight:600}
.gzh small{display:block;font-size:10px;color:var(--mut);margin-top:1px}
.gzh .ar{color:var(--sea2);font-size:16px}
.setting{position:fixed;right:14px;top:56px;z-index:7;background:rgba(255,255,255,.96);
border:1px solid var(--line);border-radius:16px;padding:18px;width:252px;box-shadow:0 8px 30px rgba(45,74,71,.18);display:none}
.setting.show{display:block}
.setting h3{margin:0 0 14px;font-size:15px;color:var(--sea);text-align:center;letter-spacing:2px}
.setting .row{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;font-size:12.5px;color:var(--ink)}
.setting .row small{display:block;color:var(--mut);font-size:10px;margin-top:2px}
.setting .sw{width:44px;height:25px;border-radius:14px;background:#cdd8d3;position:relative;cursor:pointer;transition:background .2s;flex:none}
.setting .sw.on{background:var(--sea2)}
.setting .sw i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.setting .sw.on i{left:22px}
.setting .rec{margin-top:12px;background:rgba(45,107,99,.06);border-radius:10px;padding:11px 12px;font-size:11px;color:var(--mut);line-height:1.8}
.setting .rec b{color:var(--sea2)}
.setting .close{display:block;width:100%;margin-top:14px;background:var(--sea);color:#fff;border:none;border-radius:20px;padding:9px;font-size:12.5px;letter-spacing:2px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(14px);
background:rgba(43,74,71,.92);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:20px;
opacity:0;pointer-events:none;transition:.25s;z-index:99;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<body>
<canvas id="cv"></canvas>
<div class="top">
  <a href="../index.html">‹ 小岛</a>
  <button class="name">龟背湾</button>
  <button id="setBtn">设置</button>
</div>
<div class="hint" id="hint">帮海龟把壳上的藤壶轻轻清掉<small id="hintSub">点一下藤壶就好</small></div>
<div class="act"><button id="actBtn">用 水 冲 一 冲</button></div>
<div class="tabs">
  <span class="cur">龟背湾</span><a href="../game3/index.html">星火滩</a><a href="../game2/index.html">白鸥礁</a>

</a>

<div class="setting" id="setting">
  <h3>设 置</h3>
  <div class="row"><span>声音<small>海浪、冲洗与放归的提示音</small></span><div class="sw on" id="swSound"><i></i></div></div>
  <div class="row"><span>轻震动<small>清除藤壶时的轻微反馈</small></span><div class="sw on" id="swVibe"><i></i></div></div>
  <div class="rec">已送回 <b id="recSaved">0</b> 只海龟 · 今天第 <b id="recToday">1</b> 只<br>数据只保存在本机，不含货币、商城与社交功能</div>
  <button class="close" id="setClose">关闭</button>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
  function resize(){W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);layout();}
  window.addEventListener('resize',resize);

  var KEY='game1_turtle_v1';
  var save={total:0,date:'',today:0};
  try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)save=s;}catch(e){}
  var today=new Date().toISOString().slice(0,10);
  if(save.date!==today){save.date=today;save.today=0;}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}

  var AC=null,ambient=null,soundOn=true,vibeOn=true;
  function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
  function noiseBuf(a,sec){var len=Math.floor(a.sampleRate*sec),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0),last=0;
    for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5;}return b;}
  function startAmbient(){
    var a=ac();if(!a||ambient)return;
    var src=a.createBufferSource();src.buffer=noiseBuf(a,4);src.loop=true;
    var lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;
    var g=a.createGain();g.gain.value=0.0;
    src.connect(lp);lp.connect(g);g.connect(a.destination);src.start();
    g.gain.linearRampToValueAtTime(soundOn?0.16:0,a.currentTime+4);
    var osc=a.createOscillator(),og=a.createGain();osc.frequency.value=0.025;og.gain.value=0.05;
    osc.connect(og);og.connect(g.gain);osc.start();
    ambient={src:src,gain:g};
  }
  function beep(freq,dur,type,vol){
    if(!soundOn)return;var a=ac();if(!a)return;
    var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.12,a.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+(dur||0.3));
    o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+(dur||0.3)+0.05);
  }
  function vibe(){if(vibeOn&&navigator.vibrate)try{navigator.vibrate(18);}catch(e){}}

  var state='clean';
  var turtle={x:0,y:0,r:0,alpha:1,swim:0,barnacles:[]};
  var shellTone=['#7f9c86','#6f9079','#89a68e'],shellIdx=0;
  var rinsing=0,particles=[];
  var hint=document.getElementById('hint'),actBtn=document.getElementById('actBtn'),toast=document.getElementById('toast');
  function tmsg(a,b){hint.innerHTML=a+'<small>'+b+'</small>';}
  function toastShow(m){toast.textContent=m;toast.classList.add('show');clearTimeout(toastShow._t);toastShow._t=setTimeout(function(){toast.classList.remove('show');},1800);}

  function layout(){var base=Math.min(W,H*0.62);turtle.r=base*0.30;turtle.x=W/2;turtle.y=H*0.60;}
  function resetTurtle(){
    state='clean';rinsing=0;particles=[];turtle.alpha=1;turtle.swim=0;
    shellIdx=Math.floor(Math.random()*shellTone.length);
    var n=4+Math.floor(Math.random()*3);turtle.barnacles=[];
    for(var i=0;i<n;i++){var ang=Math.random()*Math.PI*2,rad=Math.random()*turtle.r*0.55;
      turtle.barnacles.push({x:Math.cos(ang)*rad,y:Math.sin(ang)*rad*0.7,r:7+Math.random()*4,alive:true});}
    actBtn.classList.remove('on');
    tmsg('帮海龟把壳上的藤壶轻轻清掉','点一下藤壶就好');
  }
  function remain(){return turtle.barnacles.filter(function(b){return b.alive;}).length;}

  var t=0;
  function drawSky(){
    var g=ctx.createLinearGradient(0,0,0,H*0.55);
    g.addColorStop(0,'#eef6f1');g.addColorStop(1,'#dcece6');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H*0.58);
    ctx.fillStyle='rgba(246,230,189,.75)';ctx.beginPath();ctx.arc(W*0.82,H*0.14,26,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.6)';
    ctx.beginPath();ctx.ellipse(W*0.28,H*0.18,42,11,0,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(W*0.55,H*0.12,30,8,0,0,7);ctx.fill();
  }
  function drawSea(){
    var y=H*0.40,g=ctx.createLinearGradient(0,y,0,H*0.68);
    g.addColorStop(0,'#a9cfc6');g.addColorStop(1,'#7fb6ac');ctx.fillStyle=g;
    ctx.beginPath();ctx.moveTo(0,y);
    for(var x=0;x<=W;x+=12)ctx.lineTo(x,y+Math.sin(x*0.02+t*0.9)*3);
    ctx.lineTo(W,H*0.70);ctx.lineTo(0,H*0.70);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.5;
    for(var k=0;k<3;k++){ctx.beginPath();var yy=y+18+k*16;
      for(var x2=0;x2<=W;x2+=14){var py=yy+Math.sin(x2*0.03+t*1.2+k)*2;if(x2===0)ctx.moveTo(x2,py);else ctx.lineTo(x2,py);}ctx.stroke();}
  }
  function drawSand(){
    var y=H*0.62,g=ctx.createLinearGradient(0,y,0,H);
    g.addColorStop(0,'#efe1c0');g.addColorStop(1,'#e2cfa6');ctx.fillStyle=g;ctx.fillRect(0,y,W,H-y);
    ctx.strokeStyle='rgba(180,150,100,.18)';ctx.lineWidth=1;
    for(var k=0;k<4;k++){ctx.beginPath();ctx.moveTo(0,H*0.70+k*22);ctx.quadraticCurveTo(W/2,H*0.70+k*22+6,W,H*0.70+k*22);ctx.stroke();}
  }
  function drawTurtle(){
    var x=turtle.x,y=turtle.y+turtle.swim,r=turtle.r,a=turtle.alpha;
    ctx.save();ctx.globalAlpha=a;
    ctx.fillStyle='rgba(80,96,70,.15)';ctx.beginPath();ctx.ellipse(x,y+r*0.5,r*1.15,r*0.28,0,0,7);ctx.fill();
    ctx.fillStyle='#6f9079';
    ctx.beginPath();ctx.ellipse(x-r*0.85,y-r*0.1,r*0.42,r*0.20,-0.5,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+r*0.85,y-r*0.1,r*0.42,r*0.20,0.5,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(x-r*0.6,y+r*0.55,r*0.26,r*0.16,0.4,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+r*0.6,y+r*0.55,r*0.26,r*0.16,-0.4,0,7);ctx.fill();
    var headY=y-r*0.55;
    ctx.fillStyle='#89a68e';ctx.beginPath();ctx.ellipse(x,headY,r*0.34,r*0.30,0,0,7);ctx.fill();
    ctx.strokeStyle='#3c5a50';ctx.lineWidth=1.6;
    ctx.beginPath();ctx.arc(x-r*0.14,headY-r*0.02,r*0.07,0.15,Math.PI-0.15);ctx.stroke();
    ctx.beginPath();ctx.arc(x+r*0.14,headY-r*0.02,r*0.07,0.15,Math.PI-0.15);ctx.stroke();
    ctx.fillStyle=shellTone[shellIdx];ctx.beginPath();ctx.ellipse(x,y,r,r*0.78,0,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.ellipse(x-r*0.22,y-r*0.18,r*0.5,r*0.34,-0.3,0,7);ctx.fill();
    ctx.strokeStyle='rgba(60,90,80,.35)';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.ellipse(x,y,r*0.62,r*0.48,0,0,7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-r*0.62,y);ctx.lineTo(x+r*0.62,y);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y-r*0.48);ctx.lineTo(x,y+r*0.48);ctx.stroke();
    turtle.barnacles.forEach(function(b){
      if(!b.alive)return;var bx=x+b.x,by=y+b.y;
      ctx.fillStyle='#cbb894';ctx.beginPath();ctx.arc(bx,by,b.r,0,7);ctx.fill();
      ctx.fillStyle='#a8916a';ctx.beginPath();ctx.arc(bx,by,b.r*0.45,0,7);ctx.fill();
      ctx.strokeStyle='rgba(90,70,45,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(bx,by,b.r,0,7);ctx.stroke();
    });
    ctx.restore();
  }
  function drawFx(){
    if(state==='rinse'&&rinsing>0){
      ctx.save();ctx.globalAlpha=0.4;
      for(var i=0;i<40;i++){var px=turtle.x+Math.sin(i*12.9+t*3)*turtle.r*1.1;
        var py=turtle.y-turtle.r*1.4+((t*160+i*13)%120);
        ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(px,py,1.5,0,7);ctx.fill();}
      ctx.restore();
    }
    particles.forEach(function(p){ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();});
    ctx.globalAlpha=1;
  }
  function loop(){t+=0.016;ctx.clearRect(0,0,W,H);drawSky();drawSea();drawSand();drawTurtle();drawFx();
    particles=particles.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.a-=0.02;return p.a>0;});
    if(state==='release'){
      turtle.swim+=0.6;turtle.alpha-=0.008;
      if(turtle.alpha<=0){state='done';save.total++;save.today++;persist();
        actBtn.classList.add('on');actBtn.textContent='再 送 一 只 ›';
        tmsg('它回到海里了，谢谢你','今天已经帮了 '+save.today+' 只海龟');toastShow('已送回 '+save.total+' 只海龟');updateRec();}
    }
    requestAnimationFrame(loop);
  }
  function burst(x,y,color){for(var i=0;i<10;i++)particles.push({x:x,y:y,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3-1,r:1+Math.random()*2,a:1,c:color});}
  function hit(px,py){
    if(state!=='clean')return;var x=turtle.x,y=turtle.y;
    for(var i=0;i<turtle.barnacles.length;i++){var b=turtle.barnacles[i];if(!b.alive)continue;
      var bx=x+b.x,by=y+b.y;
      if(Math.hypot(px-bx,py-by)<b.r+16){
        b.alive=false;burst(bx,by,'#cbb894');beep(520+Math.random()*120,0.18,'sine',0.10);vibe();TRACK('barnacle',{left:remain()});
        if(remain()===0){state='rinse';rinsing=1;tmsg('干净多了，再用水冲一冲','按下面的按钮，让水缓缓流过');
          setTimeout(function(){actBtn.classList.add('on');actBtn.textContent='用 水 冲 一 冲';},400);}
        return;}}
  }
  cv.addEventListener('pointerdown',function(e){startAmbient();
    if(state==='clean')hit(e.clientX,e.clientY);
    else if(state==='rinse')burst(turtle.x+(Math.random()*20-10),turtle.y+turtle.r*0.4+20,'rgba(255,255,255,.9)');});
  actBtn.addEventListener('click',function(){
    if(state==='rinse'){
      state='release';actBtn.classList.remove('on');rinsing=0;
      for(var i=0;i<24;i++)burst(turtle.x+(Math.random()-.5)*turtle.r,turtle.y,'rgba(255,255,255,.9)');
      beep(660,0.5,'sine',0.12);setTimeout(function(){beep(880,0.5,'sine',0.1);},160);
      tmsg('去吧，回到你的海里','轻轻的，不着急');TRACK('release',{});
    }else if(state==='done')resetTurtle();
  });
  var setting=document.getElementById('setting');
  document.getElementById('setBtn').addEventListener('click',function(){setting.classList.toggle('show');updateRec();});
  document.getElementById('setClose').addEventListener('click',function(){setting.classList.remove('show');});
  function sw(id,cb){var el=document.getElementById(id);el.addEventListener('click',function(){el.classList.toggle('on');cb(el.classList.contains('on'));});}
  sw('swSound',function(v){soundOn=v;if(ambient&&AC)ambient.gain.gain.setTargetAtTime(v?0.16:0,AC.currentTime,0.1);if(v)beep(560,0.15,'sine',0.1);});
  sw('swVibe',function(v){vibeOn=v;});
  function updateRec(){document.getElementById('recSaved').textContent=save.total;document.getElementById('recToday').textContent=save.today;}
  document.getElementById('gzhBtn').addEventListener('click',function(){
    TRACK('gzh_click',{});if(inWeChat){location.href=GZH_HOME;return;}
    try{var ta=document.createElement('textarea');ta.value=GZH_NAME;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toastShow('已复制「'+GZH_NAME+'」，去微信搜索关注');}catch(e){toastShow('请在微信搜索「'+GZH_NAME+'」');}
  });
  resize();resetTurtle();updateRec();loop();
})();
</script>
</body>
