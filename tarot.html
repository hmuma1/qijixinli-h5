<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>塔罗小屋 · 奇历小岛</title>
<meta content="抽一张牌，听听此刻想对你说的话。" name="description">
<style>
:root{
  --bg:#0e0b1a; --bg2:#171031; --gold:#d9b25f; --gold2:#f0d79a;
  --ink:#ece6f5; --mut:#9b8fb8; --line:rgba(217,178,95,.28);
  --card:#1c1633; --card2:#241b40;
  --fire:#ff8a5c; --water:#5cc8ff; --air:#7fe0c0; --earth:#d9b25f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(120% 90% at 50% 0%,#221846 0%,var(--bg) 55%);
  color:var(--ink);min-height:100vh;overflow-x:hidden}
.wrap{max-width:520px;margin:0 auto;padding:10px 16px 40px}
.head{text-align:center;margin:2px 0 4px}
.brand{font-size:12px;letter-spacing:3px;color:var(--gold)}
.title{font-size:26px;font-weight:600;margin:6px 0 2px;color:var(--gold2)}
.sub{font-size:13px;color:var(--mut);margin:0}
.star{position:fixed;inset:0;pointer-events:none;z-index:0}
.star i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:.8}}
.screen{position:relative;z-index:1}
.spreads{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.sp{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:16px;padding:14px 12px;cursor:pointer;transition:.2s}
.sp:active{transform:scale(.97)}
.sphd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sphd svg{height:24px;width:auto;flex:none}
.sp h3{margin:0;font-size:15px;color:var(--gold2);font-weight:600;line-height:1.3}
.sp h3 .cnt{font-size:11.5px;color:var(--mut);font-weight:400}
.sp p{margin:0;font-size:11.5px;color:var(--mut);line-height:1.5}
.spreadT{margin:8px 0 0;text-align:center}
.spreadT h3{margin:0;font-size:17px;color:var(--gold2);font-weight:600}
.spreadT p{margin:3px 0 0;font-size:12px;color:var(--mut)}
#deck{--cw:min(110px,calc((100vw - 76px)/3));margin-top:16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.row{display:grid;gap:10px;justify-content:center;width:100%}
.r1{grid-template-columns:var(--cw);max-width:var(--cw)}
.rapex{grid-template-columns:var(--cw);max-width:var(--cw)}
.r2{grid-template-columns:repeat(2,var(--cw));max-width:calc(var(--cw)*2 + 10px)}
.r3{grid-template-columns:repeat(3,var(--cw));max-width:calc(var(--cw)*3 + 20px)}
.rbottom{grid-template-columns:var(--cw);max-width:var(--cw)}
.abwrap{display:grid;grid-template-columns:var(--cw) var(--cw);gap:12px;justify-content:center;width:100%}
.abcol{display:flex;flex-direction:column;gap:10px}
.ablabel{text-align:center;font-size:12px;letter-spacing:2px;color:var(--gold);border-bottom:1px dashed var(--line);padding-bottom:4px}
.slot{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%}
.card{perspective:900px;width:100%;aspect-ratio:5/8;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.back{background:radial-gradient(circle at 50% 38%,rgba(217,178,95,.22),transparent 60%),linear-gradient(160deg,#2a1f4d,#160f2c);align-items:center;justify-content:center}
.back .glyph{font-size:30px;color:var(--gold);opacity:.85}
.back .hint{position:absolute;bottom:8px;font-size:10px;color:var(--mut)}
.front{background:linear-gradient(160deg,var(--card2),var(--card));transform:rotateY(180deg);padding:5px;gap:2px}
.fart{flex:1;min-height:0;width:88%;margin:0 auto;display:flex;align-items:center;justify-content:center}
.fart svg{width:100%;height:100%}
.fmeta{text-align:center;padding-bottom:2px}
.fname{font-size:11px;font-weight:600;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcor{font-size:10px;margin-top:1px}
.fcor.up{color:#7fd6a3}.fcor.rev{color:#e08a8a}
.poscap{font-size:10.5px;color:var(--gold);letter-spacing:.5px;text-align:center;opacity:.9}
.syn{margin-top:16px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:14px 15px;width:100%}
.syn h4{margin:0 0 8px;color:var(--gold2);font-size:14px;letter-spacing:1px}
.syn p{margin:0 0 8px;font-size:12.5px;line-height:1.65;color:var(--ink);opacity:.93}
.syn p:last-child{margin-bottom:0;color:var(--mut);font-size:11.5px}
.bar{display:flex;gap:8px;margin-top:16px}
.btn{background:linear-gradient(160deg,var(--gold),#b8863a);color:#1a1330;border:none;
  border-radius:20px;padding:9px 4px;font-size:12.5px;font-weight:600;cursor:pointer;flex:1;min-width:0;text-align:center}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(8,5,18,.92);display:none;align-items:center;
  justify-content:center;z-index:40;padding:20px}
.modal.show{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:20px;max-width:380px;width:100%;max-height:80vh;overflow:auto}
.modal textarea{width:100%;height:150px;background:#120d24;color:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:10px;font-size:12.5px;line-height:1.6;resize:none}
.cmodal{position:fixed;inset:0;background:rgba(8,5,18,.95);display:none;z-index:50;overflow-y:auto;padding:20px 14px 40px}
.cmodal.show{display:block}
.cbox{position:relative;max-width:320px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 16px}
.cclose{position:absolute;top:8px;right:8px;background:none;border:1px solid var(--line);color:var(--mut);border-radius:50%;width:28px;height:28px;font-size:13px;cursor:pointer;z-index:2}
.cart{width:38%;margin:2px auto 8px}
.cart svg{width:100%;height:auto;display:block}
.chead{text-align:center;margin-bottom:7px}
.cname{font-size:16px;font-weight:600;color:var(--gold2);display:flex;align-items:center;justify-content:center;gap:6px}
.el{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:10px;border:1px solid currentColor}
.el-火{color:var(--fire)} .el-水{color:var(--water)} .el-风{color:var(--air)} .el-土{color:var(--earth)}
.csub{font-size:11.5px;color:var(--mut);margin-top:3px}
.ckw{font-size:12px;color:var(--gold);margin-bottom:5px}
.cimg{font-size:11.5px;color:var(--ink);opacity:.82;line-height:1.55;margin-bottom:5px}
.cimg span{color:var(--mut)}
.cmean{font-size:12.5px;color:var(--ink);line-height:1.6}
.tend{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.tend-title{font-size:11px;color:var(--gold);margin-bottom:3px;letter-spacing:.5px}
.tend-item{font-size:11px;color:var(--ink);opacity:.86;line-height:1.5}
.tend-item span{color:var(--gold2);font-weight:600;margin-right:5px}
.entry{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ebtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 8px 14px;text-decoration:none;color:var(--ink);
  transition:border-color .2s,background .2s,transform .12s;cursor:pointer}
.ebtn:hover{border-color:var(--gold);background:var(--card2)}
.ebtn:active{transform:scale(.97)}
.ebtn .eico{width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,rgba(217,178,95,.22),rgba(240,215,154,.05));
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.ebtn .eico svg{width:20px;height:20px;stroke:var(--gold2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ebtn b{font-size:13px;color:var(--gold2);letter-spacing:.5px}
.ebtn small{font-size:10.5px;color:var(--mut);letter-spacing:.2px}
.ebtn .earrow{font-size:14px;color:var(--gold);opacity:.65;line-height:1}
.gbar{grid-column:1/-1;display:flex;align-items:center;gap:12px;
  background:linear-gradient(135deg,rgba(217,178,95,.10),rgba(240,215,154,.02));
  border:1px solid var(--line);border-radius:14px;padding:13px 16px;
  text-decoration:none;color:var(--ink);transition:border-color .2s,background .2s,transform .12s}
.gbar:hover{border-color:var(--gold);background:var(--card2)}
.gbar:active{transform:scale(.985)}
.gbar .gico{flex:none;width:34px;height:34px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;background:rgba(217,178,95,.16);border:1px solid var(--line)}
.gbar .gico svg{width:19px;height:19px;stroke:var(--gold2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.gbar .gtxt{flex:1;min-width:0}
.gbar b{display:block;font-size:13px;color:var(--gold2);letter-spacing:.5px}
.gbar small{display:block;font-size:10.5px;color:var(--mut);margin-top:2px}
.gbar .garrow{color:var(--gold);opacity:.7;font-size:17px;line-height:1}
.emodal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(8,6,18,.78);padding:22px}
.emodal.on{display:flex}
.ebox{width:100%;max-width:340px;background:var(--card2);border:1px solid var(--line);
  border-radius:18px;padding:22px 20px;text-align:center;max-height:82vh;overflow-y:auto}
.ebox h3{margin:0 0 12px;font-size:16px;color:var(--gold2)}
.ebox p{margin:8px 0;font-size:12.5px;color:var(--mut);line-height:1.75;text-align:left}
.ebox p b{color:var(--ink)}
.ebox img{width:150px;height:150px;background:#fff;border-radius:12px;padding:6px;margin:12px 0 4px}
.ebox .btn{margin-top:14px}
.foot{text-align:center;color:var(--mut);font-size:11px;margin-top:22px;line-height:1.7}
</style>
</head>

<script>
const CARDS = [{"n": "0", "name": "愚人", "en": "The Fool", "group": "大阿尔克纳", "el": "风", "img": "白衣少年背着小包袱，无忧无虑地走向山崖边，脚边的小狗提醒他留意脚下。", "kw": "启程 · 纯真 · 未知", "up": "新的起点在召唤，你被邀请放下预设、带着信任迈出第一步。这段未知恰恰藏着属于你的机会，敢走就有机遇。", "rev": "你并非真想出发，只是想逃。逆位常是盲目冒进或临阵退缩的两极——先看清自己逃避的对象，再决定要不要上路。"}, {"n": "1", "name": "魔术师", "en": "The Magician", "group": "大阿尔克纳", "el": "风", "img": "人物一手指天一手指地，面前摆着四元素法器，将天地能量收归己用。", "kw": "创造 · 整合 · 行动", "up": "你手上的资源比想象中齐全，意念与行动在此刻合一。今天适合主动开创，把想法落成具体动作，而非等待。", "rev": "能力在，却被自我怀疑或分心稀释。逆位多表现为聪明用错地方、才华空转——先收拢注意力，别同时抓太多事。"}, {"n": "2", "name": "女祭司", "en": "The High Priestess", "group": "大阿尔克纳", "el": "水", "img": "端坐于两根柱子之间的女神，脚下新月，身后是 veil 半掩的秘境。", "kw": "直觉 · 内隐 · 秘密", "up": "答案不在喧嚣的外界，而在你安静时的直觉里。今天少听旁人，多问自己真正想要什么，潜意识会给你信号。", "rev": "你忽视了内在声音，被信息淹没或过度理性。逆位提醒：暂停一下，让潜意识浮上来，别用脑补代替感受。"}, {"n": "3", "name": "皇后", "en": "The Empress", "group": "大阿尔克纳", "el": "土", "img": "丰腴的女神置身于果实与流水之间，象征大地母亲的丰饶与孕育。", "kw": "丰盛 · 滋养 · 孕育", "up": "丰饶期到了，关系、创作或事业都在生长。懂得接纳与给予，自会结果；你越是松弛，越能吸引好事。", "rev": "你对自己太苛刻，或过度付出却不顾自身。逆位多是以爱之名耗竭自己——先把滋养还给自己，再来谈给予。"}, {"n": "4", "name": "皇帝", "en": "The Emperor", "group": "大阿尔克纳", "el": "火", "img": "戴盔甲的君主手握权杖端坐石座，背后高山象征稳固的秩序与掌控。", "kw": "秩序 · 掌控 · 结构", "up": "用结构和规则稳住局面，今天适合拍板、建框架、把混乱变成可执行的步骤。你的定力就是他人的依靠。", "rev": "控制沦为僵化或控制欲。逆位常是滥用权威、或被规则反噬——适度放权，别让秩序变成对他人的压迫。"}, {"n": "5", "name": "教皇", "en": "The Hierophant", "group": "大阿尔克纳", "el": "土", "img": "手持 triple cross 的宗教导师，向两位信徒传递既有的智慧与传统。", "kw": "传统 · 传承 · 指引", "up": "向有经验的人或已被验证的方法请教，循着既定路径走，比独自摸索更稳。今天适合学习、拜师、遵循规范。", "rev": "你正被僵化的规则或权威束缚。逆位提醒：该质疑的不是你，而是那套不再适用的教条，走出舒适的传统。"}, {"n": "6", "name": "恋人", "en": "The Lovers", "group": "大阿尔克纳", "el": "风", "img": "天使居于男女之间，背后智慧树与生命树，象征一次涉及价值的真实选择。", "kw": "选择 · 结合 · 价值", "up": "一次需要诚实地面对内心的选择来了，答案藏在你的真实偏好里，而非他人期待。关系的结合也在此刻被促成。", "rev": "关系或选择里有拉扯与逃避。逆位不是没有爱，而是用表面和谐掩盖核心分歧——先对齐价值观，再谈结合。"}, {"n": "7", "name": "战车", "en": "The Chariot", "group": "大阿尔克纳", "el": "水", "img": "御者立于黑白斑纹的双狮拉车之前，以意志驾驭相反的力量向前。", "kw": "意志 · 前进 · 胜利", "up": "凭意志与专注往前冲，今天能赢，但前提是两种力量（情绪与理性）同时被你驾驭。方向清晰，胜利可期。", "rev": "方向感乱了，油门和刹车一起踩。逆位多是内部分裂、被情绪带偏——先定一个目标，别被两边拉扯耗尽。"}, {"n": "8", "name": "力量", "en": "Strength", "group": "大阿尔克纳", "el": "火", "img": "温柔的女子合手驯服一头雄狮，以耐心而非武力让猛兽低头。", "kw": "柔韧 · 勇气 · 克制", "up": "真正的力量是温柔地驯服冲动。以耐心对待自己与他人，看似难搞的事会松动，内在的勇气自然回来。", "rev": "你在外强内耗，或用控制代替理解。逆位首要意义是软弱无能、信心消散——先安抚情绪，力量才回得来。"}, {"n": "9", "name": "隐士", "en": "The Hermit", "group": "大阿尔克纳", "el": "土", "img": "提灯的老者独立于雪峰，灯火是他向内寻找的真理之光。", "kw": "独处 · 内省 · 寻道", "up": "是时候退后一步独自厘清了。孤独不是惩罚，而是你找回方向的必要距离；向内的探索会给你答案。", "rev": "你要么过度孤立，要么在人群里依然迷失。逆位提醒：适度回来，别把独处变成封闭，也别用忙碌逃避。"}, {"n": "10", "name": "命运之轮", "en": "Wheel of Fortune", "group": "大阿尔克纳", "el": "火", "img": "转动的巨轮上缘坐于宝座者上升、下缘者下沉，象征运势的轮回。", "kw": "转机 · 周期 · 命运", "up": "局势正在转向，好运或新机到来。顺势而为，别逆着周期硬扛；轮到你上升时，抓住这股势。", "rev": "处于轮子的底部或反复期，像到低谷的滞留。逆位不是厄运，而是提醒你接受起伏是常态，耐心等它再转上来。"}, {"n": "11", "name": "正义", "en": "Justice", "group": "大阿尔克纳", "el": "风", "img": "蒙眼女神一手天平一手宝剑，不偏不倚地称量因果。", "kw": "公平 · 因果 · 平衡", "up": "事情会按你付出的真实分量结算。今天适合做公正的决定，言行要对得起自己，法律或契约事项尤其顺利。", "rev": "你在逃避该承担的后果，或被人占了便宜却不吭声。逆位提醒：把秤摆正，该清算就清算，含糊只会失衡。"}, {"n": "12", "name": "倒吊人", "en": "The Hanged Man", "group": "大阿尔克纳", "el": "水", "img": "男子头下脚上倒挂于活树，神态平静，仿佛主动选择的暂停。", "kw": "暂停 · 换位 · 臣服", "up": "主动停一下，换个角度看，反而会看清。这不是放弃，而是换一种姿态等待，牺牲表象换来更深的领悟。", "rev": "你在被动拖延、假装放下，其实是不肯面对。逆位的吊人多是该转身却拖延——真正的转身需要先落地行动。"}, {"n": "13", "name": "死神", "en": "Death", "group": "大阿尔克纳", "el": "水", "img": "白马上的骷髅手持黑旗，众人俯首，象征不可抗拒的结束与转化。", "kw": "结束 · 蜕变 · 重生", "up": "一段该翻篇了。允许旧的结束，新的空间才会打开；这不恐怖，是更新，是生命更高一层的循环。", "rev": "你紧抓着早已坏死的关系或身份不放。逆位提示：不告别，就接不住后面的礼物，拖延只会让结束更痛。"}, {"n": "14", "name": "节制", "en": "Temperance", "group": "大阿尔克纳", "el": "火", "img": "大天使将一杯之水倒入另一杯，一脚踩水一脚踏岸，调和两种能量。", "kw": "调和 · 中庸 · 耐心", "up": "把对立的元素慢慢搅匀，今天靠的是分寸与融合，而非极端或急躁。不同性质的能量也能交流顺畅。", "rev": "你失衡了，要么过度要么压抑。逆位提醒回到中间，给生活重新配比，别让一头过重拖垮整体。"}, {"n": "15", "name": "恶魔", "en": "The Devil", "group": "大阿尔克纳", "el": "土", "img": "山羊形象的恶魔立于锁链两端的两人之上，锁链其实松到可以挣脱。", "kw": "执念 · 束缚 · 欲望", "up": "看清是什么在绑住你——物质、习惯或一段消耗型关系。链子其实有钥匙，承认被缚是松绑的第一步。", "rev": "你开始松动执念、挣脱旧循环了。逆位是好兆头，但别因一时反复又把自己锁回去，自由已在手边。"}, {"n": "16", "name": "高塔", "en": "The Tower", "group": "大阿尔克纳", "el": "火", "img": "被闪电击中的塔轰然崩塌，火光中有人坠落，王冠跌落。", "kw": "崩塌 · 突变 · 觉醒", "up": "某些根基会被突然掀翻，痛但必要。旧的虚假结构倒下，真相才露出来；摧毁是为了重建在更实的地基上。", "rev": "你提前预感崩塌而焦虑，或事后拒绝接受。逆位提醒先稳住，废墟里才有新地基，抗拒只会延长动荡。"}, {"n": "17", "name": "星星", "en": "The Star", "group": "大阿尔克纳", "el": "风", "img": "裸身的女子跪于水边倒水入池入河，身后大星小星照亮夜空。", "kw": "希望 · 疗愈 · 指引", "up": "风暴过后星光出现，希望回来。允许自己被治愈，前方比你想的明亮；你与潜意识的连结正在修复。", "rev": "你暂时失去信心，在自我怀疑里漂浮。逆位提醒：光一直没灭，只是你低了头——抬头看，希望仍在。"}, {"n": "18", "name": "月亮", "en": "The Moon", "group": "大阿尔克纳", "el": "水", "img": "月光下两条狗狼对月嚎叫，小路通向远处似有出口的迷雾山。", "kw": "迷雾 · 潜意识 · 不安", "up": "眼前有看不清的迷雾，别急着下结论。先分辨哪些是恐惧、哪些是真实，月亮照见的是潜意识而非事实。", "rev": "迷雾在散，混乱的真相开始浮现。逆位表示你比自己以为的更接近答案，看清假象后不安会退去。"}, {"n": "19", "name": "太阳", "en": "The Sun", "group": "大阿尔克纳", "el": "火", "img": "金黄的太阳之下，裸身孩童骑马上，红旗下飘，万物明朗欢欣。", "kw": "喜悦 · 明朗 · 成功", "up": "明朗、温暖、被看见的一天。事情朝向顺利，也适合表达、连接与庆祝，内在的快乐会外显。", "rev": "你因一点阴影怀疑整体的光。逆位并非结果不好，只是你忘了抬头感受暖意——整体仍是向阳的。"}, {"n": "20", "name": "审判", "en": "Judgement", "group": "大阿尔克纳", "el": "火", "img": "天使吹响号角，墓中之人苏醒起身，象征清算与召唤。", "kw": "清算 · 觉醒 · 召唤", "up": "到了对自己诚实清算的时刻，过去的努力会被看见。响应内心的召唤，带着经验重新出发。", "rev": "你在回避那个早该做的决定，或困在旧评价里。逆位提醒：听见召唤就别再装睡，拖延清算只会滞留。"}, {"n": "21", "name": "世界", "en": "The World", "group": "大阿尔克纳", "el": "土", "img": "花环中的舞者四角各有生灵，象征一个循环的圆满与整合。", "kw": "圆满 · 完成 · 整合", "up": "一个循环圆满收尾，你做到了。庆祝完成，也带着经验进入下一程；身心灵在此刻合一。", "rev": "结尾差一口气，或你不愿真正放手。逆位提醒把未了的收完，圆满才会来，别让悬而未决拖住新局。"}, {"n": "W1", "name": "权杖王牌", "en": "Ace of Wands", "group": "权杖", "img": "一只云中之手高举萌发绿叶的权杖，八片叶脱离飞舞，象征创意的火花迸发。", "kw": "火花 · 灵感 · 启动", "up": "一团创造的火被点燃，灵感或冲动来了。抓住它，先动起来再说，行动本身会引出下一步。", "rev": "火花被浇灭或卡在空想。逆位不是没热情，而是被自我怀疑压住——先落下第一笔，火就会续上。", "el": "火"}, {"n": "W2", "name": "权杖二", "en": "Two of Wands", "group": "权杖", "img": "领主立于城墙远眺海洋，一手扶权杖一手握地球，筹划下一步的扩张。", "kw": "规划 · 远望 · 抉择", "up": "站在已得成果上向外看，下一步该扩张了。做计划，也敢想得更大，你已具备出海的条件。", "rev": "你犹豫着不敢跨出舒适区，守着已知却心有不甘。逆位提醒权衡够了，该选了，拖延只会消耗势能。", "el": "火"}, {"n": "W3", "name": "权杖三", "en": "Three of Wands", "group": "权杖", "img": "人物立于岸边数艘远航的船，目光追随更辽阔的海平线。", "kw": "等待 · 拓展 · 远航", "up": "前期铺垫已就位，接下来是迎接更大的局。目光放远，机会正在从远方驶来，耐心守候。", "rev": "你等得焦虑或方向判断失误。逆位提醒别只盯脚下，重新校准你要航向哪片海，盲目等待会错失。", "el": "火"}, {"n": "W4", "name": "权杖四", "en": "Four of Wands", "group": "权杖", "img": "四根巨杖耸立，花环高悬，两女子举花相庆，象征安稳与欢庆。", "kw": "安定 · 庆祝 · 归属", "up": "一段努力有了安稳的落点，值得庆祝与停留。关系或环境给你归属感，是停下来享用的时刻。", "rev": "表面热闹下并不安稳，或你不愿安定。逆位提醒先弄清是环境问题还是心没定，别用庆典掩盖空虚。", "el": "火"}, {"n": "W5", "name": "权杖五", "en": "Five of Wands", "group": "权杖", "img": "五人各执权杖相互较量，场面嘈杂却未见伤者，象征良性的竞争。", "kw": "竞争 · 混乱 · 角力", "up": "多方意见或竞争挤在一起，有点乱。别被噪音带偏，守住你的主线，乱中也有你的机会。", "rev": "你要么在无效内耗，要么回避了该有的较量。逆位提醒分清哪些仗值得打，别把精力耗在口舌。", "el": "火"}, {"n": "W6", "name": "权杖六", "en": "Six of Wands", "group": "权杖", "img": "骑马者头戴桂冠被众人簇拥前行，象征胜利与认可。", "kw": "认可 · 胜利 · 声望", "up": "你的付出被看见，迎来认可与小小的胜利。大方接受，趁势再进，这是你应得的掌声。", "rev": "你渴求认可却得不到，或胜得心虚。逆位提醒外部掌声不如先与自己和解，虚名撑不起底气。", "el": "火"}, {"n": "W7", "name": "权杖七", "en": "Seven of Wands", "group": "权杖", "img": "一人立于高处以一杖抵御下方攻来的六杖，守住既得阵地。", "kw": "防守 · 坚持 · 压力", "up": "你在守住成果，压力不小但立场要对。站稳，别轻易退让，你的坚持正挡住来犯。", "rev": "你守得疲惫，开始怀疑是否值得。逆位提醒该守的守、该放的早点放，硬撑会拖垮自己。", "el": "火"}, {"n": "W8", "name": "权杖八", "en": "Eight of Wands", "group": "权杖", "img": "八根权杖凌空飞驰，速度感十足，象征消息与进展的快速流动。", "kw": "加速 · 消息 · 流动", "up": "事情突然提速，消息或进展接连到来。顺势推进别拖，这是把积压事项一口气清掉的好时机。", "rev": "节奏乱了，信息拥堵或计划被打断。逆位提醒先理清主次，再让事情流动起来，别被乱流带跑。", "el": "火"}, {"n": "W9", "name": "权杖九", "en": "Nine of Wands", "group": "权杖", "img": "缠着绷带者倚杖守望，身后九杖林立，是尾声前的戒备。", "kw": "戒备 · 韧性 · 尾声", "up": "你已撑了很久，只剩最后一段。带着伤也别松劲，终点近了，韧性会送你到门口。", "rev": "你过度防御，把所有人都当威胁。逆位提醒放下不必要的戒备，给自己喘息，否则会垮在最后一程。", "el": "火"}, {"n": "W10", "name": "权杖十", "en": "Ten of Wands", "group": "权杖", "img": "男子奋力扛着十根沉重权杖朝远方房屋前行，负荷已到极限。", "kw": "重担 · 责任 · 超载", "up": "你扛得太多，负荷已到临界。承认超载，把不该你背的分出去，否则会倒在终点前。", "rev": "你终于学着放下或委托，重担在减轻。逆位提醒别又习惯性全揽回来，卸下才是真的解脱。", "el": "火"}, {"n": "W11", "name": "权杖侍从", "en": "Page of Wands", "group": "权杖", "img": "活泼的少年高举权杖眺望，眼中是跃跃欲试的火苗。", "kw": "好奇 · 尝试 · 热忱", "up": "带着孩子般的好奇去试探新可能，不怕露怯。热情比完美更重要，先动起来就有收获。", "rev": "三分钟热度或空喊口号不落地。逆位提醒把那点好奇变成一次真实的小行动，别停在嘴上。", "el": "火"}, {"n": "W12", "name": "权杖骑士", "en": "Knight of Wands", "group": "权杖", "img": "骏马腾跃的骑士高举权杖冲锋，火势随行，行动力爆棚。", "kw": "冲动 · 热情 · 行动", "up": "行动力爆棚，适合冲一波、搞事情。只是别只顾快忘了看路，热情能带你走很远。", "rev": "你莽撞或方向换来换去。逆位提醒热度还在，但需要一点克制来保住成果，别因急躁翻车。", "el": "火"}, {"n": "W13", "name": "权杖王后", "en": "Queen of Wands", "group": "权杖", "img": "端坐的皇后抚弄黑猫，自信明亮，如火焰般有感染力。", "kw": "自信 · 魅力 · 明亮", "up": "你今天自带光，自信而有感染力。用它去连接、去领导，会很顺，你的热情能点燃旁人。", "rev": "你要么过度表现求关注，要么把光收起来了。逆位提醒找回那股自在的笃定，不必讨好也不必躲。", "el": "火"}, {"n": "W14", "name": "权杖国王", "en": "King of Wands", "group": "权杖", "img": "沉稳的国王持杖端坐，目光深远，是既能想又能落的领袖。", "kw": "领袖 · 远见 · 驾驭", "up": "以远见和魄力带领局面，你既能想也能落。今天适合定方向、带团队，用视野服人。", "rev": "你失控地专断或画大饼不兑现。逆位提醒真正的王靠让人信服而非压人，空谈会蚀掉威信。", "el": "火"}, {"n": "C1", "name": "圣杯王牌", "en": "Ace of Cups", "group": "圣杯", "img": "云手托起溢水的圣杯，白鸽衔十字落下，情感的新泉涌出。", "kw": "爱 · 感动 · 开端", "up": "情感的新源头打开，爱、善意或灵感涌来。允许自己被温柔打动，这是关系与感受的起点。", "rev": "情感在封闭或溢错地方。逆位提醒先照顾好内心，再谈向外给与，别让情绪干涸或泛滥。", "el": "水"}, {"n": "C2", "name": "圣杯二", "en": "Two of Cups", "group": "圣杯", "img": "两人各执圣杯相敬，上方灵蛇与狮子纹章，象征对等的结合。", "kw": "联结 · 相悦 · 对等", "up": "一段对等的情感联结在发生，互相看见、彼此呼应。珍惜这份同频，它是关系的好开端。", "rev": "关系失衡或貌合神离。逆位提醒别单方面付出，先还原成两个平等的人，再谈亲密。", "el": "水"}, {"n": "C3", "name": "圣杯三", "en": "Three of Cups", "group": "圣杯", "img": "三女举杯同庆，丰收的果实环绕，是欢聚与友谊。", "kw": "欢聚 · 友谊 · 庆祝", "up": "值得小聚与庆祝，朋友和轻松的关系给你补给。今天适合联结而非独撑，快乐会互相感染。", "rev": "社交变应酬或圈子里有攀比。逆位提醒挑真正舒服的人相处，别凑热闹，虚假热闹更累。", "el": "水"}, {"n": "C4", "name": "圣杯四", "en": "Four of Cups", "group": "圣杯", "img": "坐于树下的青年对面前三杯无动于衷，第四杯从云中递来他却未觉。", "kw": "冷淡 · 错过 · 内省", "up": "你有些倦怠、对眼前提不起劲。先接纳这份冷，再看看是不是错过了什么被递来的机会。", "rev": "你从封闭里抬头，开始重新接住递来的机会。逆位提醒别再错过眼前的好，打开手才能接到。", "el": "水"}, {"n": "C5", "name": "圣杯五", "en": "Five of Cups", "group": "圣杯", "img": "黑袍人垂首面对打翻的三杯，身后仍有两杯未倒，桥通远方。", "kw": "失落 · 遗憾 · 回头", "up": "你盯着打翻的那杯，却忘了身后还有没倒的。允许遗憾，也转身看看余下的，希望没走远。", "rev": "你正从失落里走出来，学会放下。逆位提醒 function cardArt(c){
  let body='';
  if(c.group==='大阿尔克纳'){ body=MAJOR_ART[c.n]||''; }
  else{
    const rank=parseInt(c.n.slice(1),10);
    if(rank<=10){ const wm='<g opacity="0.08">'+gSuit(c.group,50,84,3.0)+'</g>'; body=wm+pipPts(rank).map(p=>gSuit(c.group,p[0],p[1],rank===1?2.0:1.15)).join(''); }
    else { body=courtArt(rank,c.group); }
  }
  return '<svg viewBox="0 0 100 160" xmlns="http://www.w3.org/2000/svg">'+
    '<rect x="1" y="1" width="98" height="158" rx="8" fill="#f0e3c4" stroke="'+GD+'" stroke-width="1.4"/>'+
    '<rect x="5" y="5" width="90" height="150" rx="5" fill="none" stroke="'+GD+'" stroke-width="0.7" opacity="0.7"/>'+
    '<rect x="5" y="4" width="90" height="20" rx="4" fill="#efe2c2" stroke="'+GD+'" stroke-width="0.6"/>'+
    '<text x="50" y="16.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a2c1c" font-family="sans-serif">'+c.name+'</text>'+
    '<g transform="translate(0,6)">'+body+'</g></svg>';

/* ================= 综合解读引擎（按牌阵连读） ================= */
const EL_PHRASE={"火":"事情的核心在行动与推进","水":"情感与关系是主线","风":"思路与沟通决定走向","土":"落地与积累是关键"};
function kw1(c){return c.kw.split(" · ")[0];}
function elStats(st){
  const cnt={};st.cards.forEach(o=>{cnt[o.c.el]=(cnt[o.c.el]||0)+1;});
  let dom='火',m=0;for(const k in cnt){if(cnt[k]>m){m=cnt[k];dom=k;}}
  const revN=st.cards.filter(o=>o.rev).length;
  const dist=Object.keys(cnt).map(k=>k+"×"+cnt[k]).join(" · ");
  const revNote=revN===0?"全部正位，信号干脆，照着方向做即可。":("有 "+revN+" 张逆位，对应位置的事先向内理一遍，再往外发力。");
  return {cnt:cnt,dist:dist,dom:dom,elPhrase:EL_PHRASE[dom],revN:revN,revNote:revNote};
}
function genSynthesis(s,st){
  const cs=st.cards,t=elStats(st);let ps=[];
  if(s.id===1){
    ps.push("今日基调："+cs[0].c.name+"（"+(cs[0].rev?"逆位":"正位")+"），核心词「"+cs[0].c.kw+"」。");
    ps.push(cs[0].rev?"逆位提示这件事要先向内看清，别急着对外发力；把步调放慢半拍，答案自己会浮上来。":"正位顺势，今天适合把「"+kw1(cs[0].c)+"」落成一个具体动作，小步快走。");
  }else if(s.id===2){
    ps.push("现状｜"+cs[0].c.name+"（"+(cs[0].rev?"逆位":"正位")+"）：你正站在「"+cs[0].c.kw+"」的位置上。");
    ps.push("建议｜"+cs[1].c.name+"（"+(cs[1].rev?"逆位":"正位")+"）：下一步往「"+cs[1].c.kw+"」的方向借力。");
    ps.push("两张连读：现状由"+cs[0].c.el+"能量主导，解法却藏在"+cs[1].c.el+"能量里——用后者的方式去处理前者的事，就是这两张牌给你的完整答案。");
  }else if(s.id===3){
    ps.push("过去｜"+cs[0].c.name+"（"+(cs[0].rev?"逆位":"正位")+"）：「"+kw1(cs[0].c)+"」的余韵还在影响你。");
    ps.push("现在｜"+cs[1].c.name+"（"+(cs[1].rev?"逆位":"正位")+"）：你正处在「"+kw1(cs[1].c)+"」的位置。");
    ps.push("未来｜"+cs[2].c.name+"（"+(cs[2].rev?"逆位":"正位")+"）：事情朝着「"+kw1(cs[2].c)+"」延展。");
    ps.push("这条时间轴以"+t.dom+"能量为主——"+t.elPhrase+"。"+((cs[0].rev||cs[1].rev)?"前段有逆位，说明卡点在来路上：把过去那笔理清，未来位才会顺。":"来路是顺的，重点在把握当下。"));
  }else if(s.id===4){
    ps.push("塔基自左而右：根源是「"+kw1(cs[1].c)+"」，现状地基在「"+kw1(cs[2].c)+"」，挑战来自「"+kw1(cs[3].c)+"」。");
    ps.push("塔尖｜"+cs[0].c.name+"（"+(cs[0].rev?"逆位":"正位")+"）：整座塔收束于「"+kw1(cs[0].c)+"」。");
    ps.push("金字塔要自下而上读：根源理得清、现状站得稳、挑战扛得住，塔尖的「"+kw1(cs[0].c)+"」才立得起来。");
  }else if(s.id===5){
    ps.push("A 路线：现状「"+kw1(cs[0].c)+"」→ 走向「"+kw1(cs[1].c)+"」（"+cs[0].c.el+"→"+cs[1].c.el+"）。");
    ps.push("B 路线：现状「"+kw1(cs[2].c)+"」→ 走向「"+kw1(cs[3].c)+"」（"+cs[2].c.el+"→"+cs[3].c.el+"）。");
    ps.push("裁决牌｜"+cs[4].c.name+"（"+(cs[4].rev?"逆位":"正位")+"）：「"+cs[4].c.kw+"」——它是你比较两条路时用的那杆秤。");
    ps.push("别只看哪边看起来更好，看哪边的「现状」更接近你真实的处境，就顺着哪边的「走向」先走一步；"+(cs[4].rev?"逆位的裁决牌提醒：这个选择里还有你不愿承认的因素，先对自己诚实再拍板。":"正位的裁决牌支持果断拍板，别拖。"));
  }else{
    ps.push("你这边是"+cs[0].c.name+"（"+(cs[0].rev?"逆位":"正位")+"，「"+kw1(cs[0].c)+"」），对面是"+cs[1].c.name+"（"+(cs[1].rev?"逆位":"正位")+"，「"+kw1(cs[1].c)+"」）。");
    ps.push("双方现状停在「"+kw1(cs[2].c)+"」，而真正卡住进展的，是「"+kw1(cs[3].c)+"」（"+cs[3].c.name+"·"+(cs[3].rev?"逆位":"正位")+"）。");
    ps.push("走向指向「"+kw1(cs[4].c)+"」；顺着走，大概率落在「"+kw1(cs[5].c)+"」（"+cs[5].c.name+"·"+(cs[5].rev?"逆位":"正位")+"）。");
    ps.push("阵眼在「隐藏的阻碍」位：它说的是双方都没挑明的那件事。把它摆上桌面，后面两张的走向才会顺。");
  }
  ps.push("元素配比："+t.dist+"，主元素"+t.dom+"——"+t.elPhrase+"。"+t.revNote);
  return ps.map(p=>"<p>"+p+"</p>").join("");
}

/* ================= 牌阵渲染 ================= */
let ST=null;
/* ================= 首页阵型小图标（背面小卡牌） ================= */
function miniIcon(id){
  function mc(x,y){return '<rect x="'+x+'" y="'+y+'" width="14" height="22" rx="2.5" fill="#2a1f4d" stroke="#d9b25f" stroke-width="0.9"/>'+
    '<path d="M'+(x+7)+' '+(y+7)+' l1.2 2.4 2.6 .3 -1.9 1.8 .5 2.6 -2.4 -1.3 -2.4 1.3 .5 -2.6 -1.9 -1.8 2.6 -.3 Z" fill="#d9b25f" opacity=".85"/>';}
  const P={
    1:[[17,12]],
    2:[[8.5,12],[25.5,12]],
    3:[[0,12],[17,12],[34,12]],
    4:[[17,0],[0,25],[17,25],[34,25]],
    5:[[8.5,0],[25.5,0],[0,25],[17,25],[34,25]],
    6:[[0,0],[17,0],[34,0],[0,25],[17,25],[34,25]]
  }[id];
  return '<svg viewBox="0 0 48 47" xmlns="http://www.w3.org/2000/svg">'+P.map(p=>mc(p[0],p[1])).join('')+'</svg>';
}
function dispName(s){return s.name+'<span class="cnt">（'+s.cnt+'）</span>';}
function showHome(){
  document.getElementById('home').style.display='block';
  document.getElementById('read').style.display='none';
  const box=document.getElementById('spreads');box.innerHTML='';
  SPREADS.forEach(s=>{
    const d=document.createElement('div');d.className='sp';
    d.innerHTML='<div class="sphd">'+miniIcon(s.id)+'<h3>'+dispName(s)+'</h3></div><p>'+s.desc+'</p>';
    d.onclick=()=>startRead(s);
    box.appendChild(d);
  });
}
function mkSlot(i){
  const o=ST.cards[i];
  const slot=document.createElement('div');slot.className='slot';
  const card=document.createElement('div');card.className='card';
  card.innerHTML='<div class="card-inner">'+
    '<div class="face back"><div class="glyph">✶</div><div class="hint">点我翻开</div></div>'+
    '<div class="face front"><div class="fart">'+cardArt(o.c)+'</div>'+
    '<div class="fmeta"><div class="fname">'+o.c.name+'</div>'+
    '<div class="fcor '+(o.rev?'rev':'up')+'">'+(o.rev?'逆位':'正位')+'</div></div></div></div>';
  card.onclick=()=>{ if(!card.classList.contains('flipped')){card.classList.add('flipped');checkAll();} openDetail(i); };
  const cap=document.createElement('div');cap.className='poscap';cap.textContent=o.pos;
  slot.appendChild(card);slot.appendChild(cap);
  return slot;
}
function rowOf(cls,slots){const r=document.createElement('div');r.className='row '+cls;slots.forEach(x=>r.appendChild(x));document.getElementById('deck').appendChild(r);}
function startRead(s){
  document.getElementById('home').style.display='none';
  document.getElementById('read').style.display='block';
  document.getElementById('spreadTitle').innerHTML='<h3>'+s.name+'（'+s.cnt+'）</h3><p>'+s.desc+'</p>';
  const deck=document.getElementById('deck');deck.innerHTML='';
  const drawn=pick(s.pos.length);
  ST={s:s,cards:drawn.map((c,i)=>({c:c,rev:Math.random()<REV_RATE,pos:s.pos[i]}))};
  if(s.id===1){ rowOf('r1',[mkSlot(0)]); }
  else if(s.id===2){ rowOf('r2',[mkSlot(0),mkSlot(1)]); }
  else if(s.id===3){ rowOf('r3',[mkSlot(0),mkSlot(1),mkSlot(2)]); }
  else if(s.id===4){ rowOf('rapex',[mkSlot(0)]); rowOf('r3',[mkSlot(1),mkSlot(2),mkSlot(3)]); }
  else if(s.id===5){
    const wrap=document.createElement('div');wrap.className='abwrap';
    const ca=document.createElement('div');ca.className='abcol';
    const la=document.createElement('div');la.className='ablabel';la.textContent='A 方案';ca.appendChild(la);ca.appendChild(mkSlot(0));ca.appendChild(mkSlot(1));
    const cb=document.createElement('div');cb.className='abcol';
    const lb=document.createElement('div');lb.className='ablabel';lb.textContent='B 方案';cb.appendChild(lb);cb.appendChild(mkSlot(2));cb.appendChild(mkSlot(3));
    wrap.appendChild(ca);wrap.appendChild(cb);deck.appendChild(wrap);
    rowOf('rbottom',[mkSlot(4)]);
  } else { rowOf('r3',[mkSlot(0),mkSlot(1),mkSlot(2)]); rowOf('r3',[mkSlot(3),mkSlot(4),mkSlot(5)]); }
  const syn=document.getElementById('syn');syn.style.display='none';syn.innerHTML='';
  document.getElementById('flipAll').onclick=()=>{document.querySelectorAll('#deck .card').forEach(c=>c.classList.add('flipped'));checkAll();};
  document.getElementById('again').onclick=()=>startRead(s);
  document.getElementById('back').onclick=showHome;
  document.getElementById('copyBtn').onclick=openCopy;
}
function checkAll(){
  const cards=Array.prototype.slice.call(document.querySelectorAll('#deck .card'));
  if(cards.length&&cards.every(c=>c.classList.contains('flipped'))){
    const syn=document.getElementById('syn');
    syn.innerHTML='<h4>✦ 综合解读 · '+ST.s.name+'</h4>'+genSynthesis(ST.s,ST);
    syn.style.display='block';
    setTimeout(()=>{try{syn.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}},150);
  }
}
function openDetail(i){
  const o=ST.cards[i];
  const box=document.getElementById('cbox');
  box.innerHTML='<button class="cclose">✕</button>'+
    '<div class="cart">'+cardArt(o.c)+'</div>'+
    '<div class="chead"><div class="cname">'+o.c.name+' <span class="el el-'+o.c.el+'">'+o.c.el+'</span></div>'+
    '<div class="csub">'+(o.rev?'逆位':'正位')+' · 阵位：'+o.pos+'</div></div>'+
    '<div class="ckw">关键词：'+o.c.kw+'</div>'+
    '<div class="cimg"><span>牌面：</span>'+o.c.img+'</div>'+
    '<div class="cmean">'+(o.rev?o.c.rev:o.c.up)+'</div>'+
    '<div class="tend">'+genTendency(o.c,o.rev)+'</div>';
  document.getElementById('cardModal').classList.add('show');
}
const cmEl=document.getElementById('cardModal');
cmEl.addEventListener('click',e=>{if(e.target===cmEl||e.target.closest('.cclose'))cmEl.classList.remove('show');});

function openCopy(){
  const strip=t=>t.replace(/<[^>]+>/g,'');
  let txt='【塔罗小屋 · '+ST.s.name+'】\n\n';
  ST.cards.forEach(o=>{
    txt+='· '+o.pos+'：'+o.c.name+'（'+(o.rev?'逆位':'正位')+'，'+o.c.el+'）\n';
    txt+='解读：'+(o.rev?o.c.rev:o.c.up)+'\n';
    txt+='倾向：'+strip(genTendency(o.c,o.rev))+'\n\n';
  });
  txt+='【综合解读】\n'+strip(genSynthesis(ST.s,ST))+'\n\n';
  txt+='—— 来自「奇迹心li」，仅供自我觉察与启发。';
  const ta=document.getElementById('copyText');ta.value=txt;
  document.getElementById('copyModal').classList.add('show');
}
document.getElementById('closeModal').onclick=()=>document.getElementById('copyModal').classList.remove('show');
document.getElementById('doCopy').onclick=()=>{
  const ta=document.getElementById('copyText');ta.select();
  try{document.execCommand('copy');}catch(e){}
  if(navigator.clipboard){navigator.clipboard.writeText(ta.value).catch(()=>{});}
  document.getElementById('doCopy').textContent='已复制';
  setTimeout(()=>document.getElementById('doCopy').textContent='复制',1500);
};

// 星空
(function(){const s=document.getElementById('star');for(let i=0;i<60;i++){const e=document.createElement('i');

const GZH_NAME = '奇迹心li';
(function(){
  const gzhBtn=document.getElementById('gzhBtn'), gzhModal=document.getElementById('gzhModal');
  const open=m=>m&&m.classList.add('on'), close=m=>m&&m.classList.remove('on');

    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(GZH_NAME).then(done).catch(()=>fb());

      document.body.appendChild(t); t.select(); try{document.execCommand('copy');}catch(e){} t.remove(); done(); }
  });
 })();
