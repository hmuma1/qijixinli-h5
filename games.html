<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>游戏中心 · 塔罗问迹</title>
<!--
  ============================================================
  对外只有一个入口：本页 games.html。加小游戏 = 在下面 .grid 里加一张卡片，
  主站 index.html 永远不用改，网址也永远不变。

  内部技术约定（用户看不到，但必须保留，否则游戏之间会互相干扰）：
  1. 每个游戏仍独占一个目录 game1/、game2/、game3/ …，入口为该目录下 index.html。
     目录名只是文件存放位置，不再作为对外宣传的「第 N 个入口」。
  2. 每个游戏的 localStorage / sessionStorage / cookie 的 key 必须带自己独立的
     命名空间（如 game1_star_catcher_top10），同域名下才不会互相覆盖排行榜。
  3. 每个游戏单文件自包含、零外链、样式与脚本写在自己文件内，不跨游戏引用。
  4. 每个游戏自带「‹ 返回塔罗问迹」链接；也可加「‹ 返回游戏中心」。
  ============================================================
-->
<style>
:root{--bg:#0e0b1a;--card:#1c1633;--card2:#241b40;--gold:#d9b25f;--gold2:#f0d79a;
--ink:#ece6f5;--mut:#9b8fb8;--line:rgba(217,178,95,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(120% 80% at 50% 0%,#241b40,#0e0b1a 70%);
color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
padding:38px 16px 46px;user-select:none}
.wrap{max-width:520px;margin:0 auto}
.logo{text-align:center;font-size:12px;letter-spacing:.4em;color:var(--gold);margin-bottom:12px}
h1{text-align:center;font-size:29px;margin:0 0 6px;color:var(--gold2);letter-spacing:2px}
.sub{text-align:center;font-size:12.5px;color:var(--mut);margin-bottom:30px;line-height:1.7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.gcard{display:flex;flex-direction:column;align-items:center;text-align:center;
background:var(--card);border:1px solid var(--line);border-radius:18px;
padding:18px 12px 16px;text-decoration:none;color:var(--ink);
transition:border-color .2s,background .2s,transform .12s}
.gcard:not(.soon):hover{border-color:var(--gold);background:var(--card2)}
.gcard:not(.soon):active{transform:scale(.97)}
.thumb{width:100%;height:96px;border-radius:13px;margin-bottom:13px;
display:flex;align-items:center;justify-content:center;
background:radial-gradient(circle at 50% 40%,rgba(217,178,95,.22),rgba(20,14,40,.6) 70%);
border:1px solid var(--line);position:relative;overflow:hidden}
.thumb i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.55}
.thumb svg{width:46px;height:46px;stroke:var(--gold2);fill:none;stroke-width:1.4;
stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(240,215,154,.55))}
.gcard b{display:block;font-size:15px;color:var(--gold2);letter-spacing:.5px;margin-bottom:5px}
.gcard small{display:block;font-size:11px;color:var(--mut);line-height:1.6;min-height:34px}
.play{margin-top:9px;font-size:11px;color:var(--gold);letter-spacing:1px}
.soon{border-style:dashed;opacity:.62}
.soon .thumb{background:rgba(255,255,255,.03);font-size:28px;color:var(--mut)}
.soon b{color:var(--mut)}
.rule{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;
padding:15px 18px;margin-top:26px;font-size:12px;color:var(--mut);line-height:2}
.rule b{color:var(--gold2)}
.back{display:block;text-align:center;margin-top:26px;color:var(--mut);font-size:12.5px;
text-decoration:none;letter-spacing:1px}
.foot{text-align:center;margin-top:30px;font-size:11px;color:var(--mut);opacity:.75;line-height:1.8}
@media(max-width:340px){.grid{gap:10px}.thumb{height:82px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">TAROT WENJI</div>
  <h1>游戏中心</h1>
  <p class="sub">所有小游戏都在这一个入口 · 网址永远不变</p>

  <div class="grid">
    <a class="gcard" href="game1/">
      <div class="thumb">
        <i style="left:16%;top:22%"></i><i style="left:78%;top:18%"></i>
        <i style="left:24%;top:74%"></i><i style="left:85%;top:66%"></i>
        <i style="left:62%;top:38%"></i>
        <svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5-4.7-4.6 6.6-.9z"/></svg>
      </div>
      <b>捕星 30 秒</b>
      <small>抓流星 · 躲黑洞<br>连击冲分挑战</small>
      <span class="play">开 始 ›</span>
    </a>

    <div class="gcard soon">
      <div class="thumb">＋</div>
      <b>敬请期待</b>
      <small>下一个小游戏<br>正在路上</small>
    </div>
    <!-- 新增游戏：复制上面第一张 .gcard，改 href / 图标 / 名称 / 说明即可 -->
  </div>

  <div class="rule">
    <b>一个入口，游戏随便加</b><br>
    以后新增小游戏只在本页加一张图标卡片，<b>主站不用改、网址不用换</b>。<br>
    各游戏之间目录与存储互相隔离，不会拖慢速度、也不会覆盖彼此的排行榜。
  </div>

  <a class="back" href="index.html">‹ 返回塔罗问迹</a>
  <div class="foot">本页为统一游戏入口，仅供自我觉察与娱乐<br>来自「奇迹心li」</div>
</div>
</body>
</html>
