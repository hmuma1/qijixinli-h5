<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>奇li篝火</title>
<meta name="description" content="写下，点燃，然后放下。">
<link rel="stylesheet" href="css/style.css">

<!-- 数据统计（v1.12）：百度统计，完全免费。
     site_id 由号主在 tongji.baidu.com 注册后注入（32 位十六进制）；
     占位符未替换时正则不匹配 → 脚本不加载，对页面零影响。
     只统计行为次数，不上报用户输入的任何文字。 -->
<script>
var _hmt = _hmt || [];
(function loadBaiduTongji() {
  var sid = 'e8ffc5809fb30e7ae87e03bc0fce1bfc';
  if (!/^[0-9a-f]{32}$/i.test(sid)) return;
  var hm = document.createElement('script');
  hm.src = 'https://hm.baidu.com/hm.js?' + sid;
  hm.async = true;
  (document.getElementsByTagName('head')[0] || document.body).appendChild(hm);
})();
</script>
</head>
<body>

<!-- 夜空星点 -->
<canvas id="stars-canvas"></canvas>

<!-- 火光环境晕（让火苗融入夜空与地面，不是孤立贴图） -->
<div id="fire-glow"></div>

<!-- 常驻篝火（全站视觉锚点） -->
<canvas id="fire-canvas"></canvas>

<main id="stage">

  <!-- 屏 1 · 封面 -->
  <section class="screen active" id="s-intro">
    <div class="intro-box">
      <p class="intro-brand">奇迹心li</p>
      <h1 class="intro-title">奇li篝火</h1>
      <p class="intro-slogan">写下，点燃，然后放下</p>
      <p class="intro-sub">今晚，这里有一堆火，<br>和一个安静的位置</p>
      <button class="btn-main" id="btn-start">点燃篝火</button>
      <!-- v1.13：「没有围观」与陪伴氛围矛盾，「没有打扰」保全私人感且与共在兼容 -->
      <p class="intro-tip">没有账号，没有打扰，此刻的篝火一直为你点燃</p>
    </div>
  </section>

  <!-- 屏 2 · 写下 -->
  <section class="screen" id="s-write">
    <div class="write-box">
      <div class="mode-switch" id="mode-switch">
        <button class="mode-btn active" data-mode="farewell">烧掉</button>
        <button class="mode-btn" data-mode="wish">心愿</button>
      </div>
      <p class="write-prompt" id="write-prompt">今晚你想烧掉什么？</p>
      <textarea class="write-input" id="write-input" maxlength="140"
        placeholder="写下一件具体的事，越具体，火越烧得干净"></textarea>
      <div class="write-meta"><span id="char-count">0 / 140</span></div>
      <button class="btn-main" id="btn-ignite" disabled>点 火</button>
      <p class="write-tip" id="write-tip">写完点「点火」，3、2、1，交给这堆火</p>
    </div>
  </section>

  <!-- 屏 3 · 点火仪式 -->
  <section class="screen" id="s-fire">
    <div class="fire-stage">
      <div class="countdown" id="countdown"></div>
      <div class="burn-line" id="burn-line"></div>
      <!-- 仪式进度条（v1.9）：很细一条，告诉用户还要等多久；到碎裂/升空前走满 -->
      <div class="ritual-progress" id="ritual-progress"><i></i></div>
    </div>
  </section>

  <!-- 屏 4 · 火苗与回应 -->
  <section class="screen" id="s-result">
    <div class="result-box">
      <p class="result-label">火苗</p>
      <p class="fire-code" id="fire-code">#——————</p>
      <!-- v1.10：火苗代码是纯随机的仪式纪念编号（无输入/找回功能），
           用一行小字诚实说明，消除「这是干嘛的」疑惑 -->
      <p class="fire-code-note">本次火苗的编号 · 只此一次</p>
      <!-- 陪伴氛围（v1.13）：随机 2-6 人的守护意象。纪律：只报人数与守护，
           不暗示任何互动——无人名、无对话、无「对方正在看你」。
           「守护」替代「守夜」（丧礼联想，号主避讳） -->
      <p class="fire-companion" id="fire-companion"></p>
      <p class="fire-guard" id="fire-guard">有人守着火，就像有人守着你</p>
      <p class="quote-text" id="quote-text"></p>
      <p class="visit-count" id="visit-count"></p>
      <div class="result-actions">
        <button class="btn-main" id="btn-poster">保存海报</button>
        <button class="btn-ghost" id="btn-again">再点一次</button>
      </div>
    </div>
  </section>

</main>

<!-- 音效开关（右下角） -->
<button id="btn-sound" class="sound-toggle" aria-label="音效开关">音效 · 开</button>

<!-- 海报渲染区（离屏，html2canvas 用） -->
<div id="poster-wrap" aria-hidden="true">
  <div id="poster-card">
    <canvas id="poster-fire"></canvas>
    <div class="poster-city"></div>
    <p class="poster-brand">来自「奇迹心li」· 奇li篝火</p>
    <p class="poster-code" id="poster-code"></p>
    <!-- 方案A「今夜纪念卡」：日期 + 时段戳，让海报成为「这一晚」的凭证，
         回答「用户为什么要保存海报」——保存的是此刻，不是产品广告 -->
    <p class="poster-date" id="poster-date"></p>
    <p class="poster-quote" id="poster-quote"></p>
    <p class="poster-sub">完整心理测评 · 小程序搜「心li笔记」</p>
  </div>
</div>

<!-- 海报预览 -->
<div id="poster-modal">
  <img id="poster-img" alt="奇li篝火海报">
  <p class="poster-hint">长按图片保存，或截图保存</p>
  <button class="btn-ghost" id="btn-close-poster">回到火边</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="js/quotes-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
